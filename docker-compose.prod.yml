# Production overlay: do not publish Postgres, cap resources.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.prod.yml up -d
services:
  db:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
  api:
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
  admin:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
  nginx:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
