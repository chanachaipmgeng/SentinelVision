<div class="dpu-map" [style.height.px]="height" *ngIf="active">
  <agm-map
    [latitude]="lat"
    [longitude]="lng"
    [zoom]="zoom"
    [streetViewControl]="false"
    [fullscreenControl]="false"
    [mapTypeControl]="false"
    (mapReady)="onMapReady($event)">
    <agm-marker [latitude]="lat" [longitude]="lng"></agm-marker>
  </agm-map>
</div>
