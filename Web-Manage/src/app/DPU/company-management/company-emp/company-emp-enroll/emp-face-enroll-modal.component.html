<div id="modal-face" class="hs-overlay hidden ti-modal [--overlay-backdrop:false]">
  <div class="hs-overlay-open:mt-7 ti-modal-box mt-0 ease-out">
    <div class="ti-modal-content">
      <div class="ti-modal-header">
        <h6 class="modal-title text-[1rem] font-semibold text-defaulttextcolor" id="mail-ComposeLabel">บันทึกใบหน้า
        </h6>
        <button type="button" class="hs-dropdown-toggle !text-[1rem] !font-semibold !text-defaulttextcolor"
          data-hs-overlay="#modal-face" (click)="closeFaceEnrollModal()">
          <span class="sr-only">Close</span>
          <i class="ri-close-line"></i>
        </button>
      </div>
      <div class="ti-modal-body">
        <div class="relative border-b border-dashed dark:border-defaultborder/10 p-4">
          <div class="face-enroll-mode-actions flex flex-wrap justify-center gap-2 mb-4">
            <button type="button" class="ti-btn !mb-0"
              [ngClass]="faceEnrollMode === 'camera' ? 'ti-btn-primary-full' : 'ti-btn-light'"
              [disabled]="isUploadingFace"
              (click)="setFaceEnrollMode('camera')">
              <i class="ri-camera-line align-middle me-1"></i>ถ่ายจากกล้อง
            </button>
            <button type="button" class="ti-btn !mb-0"
              [ngClass]="faceEnrollMode === 'upload' ? 'ti-btn-primary-full' : 'ti-btn-light'"
              [disabled]="isUploadingFace"
              (click)="setFaceEnrollMode('upload')">
              <i class="ri-image-add-line align-middle me-1"></i>อัปโหลดรูป
            </button>
          </div>

          <div [class.hidden]="faceEnrollMode !== 'camera'">
            <div class="flex flex-wrap justify-center gap-2 mb-3">
              <div *ngFor="let step of faceAngleSteps; let i = index"
                class="flex flex-col items-center gap-1 min-w-[3.25rem]">
                <div class="w-12 h-12 rounded-lg overflow-hidden border-2 flex items-center justify-center text-xs font-semibold"
                  [ngClass]="{
                    'border-success bg-success/10': step.captured,
                    'border-primary bg-primary/10': !step.captured && i === currentAngleIndex,
                    'border-defaultborder': !step.captured && i !== currentAngleIndex
                  }">
                  <img *ngIf="step.preview" [src]="step.preview" alt="" class="w-full h-full object-cover">
                  <span *ngIf="!step.preview">{{ i + 1 }}</span>
                </div>
                <span class="text-[11px]"
                  [ngClass]="{
                    'text-success': step.captured,
                    'text-primary': !step.captured && i === currentAngleIndex,
                    'text-defaulttextcolor': !step.captured && i !== currentAngleIndex
                  }">{{ step.label }}</span>
              </div>
            </div>
            <div class="relative w-full overflow-hidden rounded">
              <video #video width="640" height="480" playsinline autoplay muted
                style="width: 100%; height: auto; object-fit: cover; display: block;">
              </video>
              <canvas #canvas width="640" height="480"
                style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none;">
              </canvas>
            </div>
            <p class="mt-3 mb-0 text-center text-sm text-defaulttextcolor">{{ faceStatus }}</p>
            <p class="mt-1 mb-0 text-center text-xs text-textmuted">{{ capturedAngleCount }}/5 มุม · ระบบถ่ายอัตโนมัติเมื่อท่าถูกต้อง</p>
          </div>

          <div [class.hidden]="faceEnrollMode !== 'upload'">
            <div class="flex flex-col items-center gap-3">
              <button type="button" class="ti-btn ti-btn-info-full modern-btn"
                [disabled]="isUploadingFace" (click)="triggerFaceUploadPicker()">
                <i class="ri-upload-2-line align-middle me-1"></i>
                เลือกรูปภาพ
              </button>
              <input #faceUploadInput type="file" class="hidden" multiple
                accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
                (change)="onFaceUploadSelected($event)">
              <p class="mb-0 text-center text-xs text-textmuted">รองรับ JPG / PNG / WEBP · เลือกได้หลายรูป</p>
            </div>
            <div *ngIf="uploadFaceItems.length" class="grid grid-cols-3 sm:grid-cols-4 gap-2 mt-4">
              <div *ngFor="let item of uploadFaceItems; let i = index" class="relative group">
                <img [src]="item.preview" alt="" class="w-full aspect-square object-cover rounded-md border border-defaultborder">
                <button type="button"
                  class="absolute top-1 right-1 ti-btn ti-btn-sm ti-btn-danger !p-1 opacity-90"
                  [disabled]="isUploadingFace"
                  (click)="removeUploadFaceItem(i)" title="ลบรูปนี้">
                  <i class="ri-close-line"></i>
                </button>
              </div>
            </div>
            <div *ngIf="!uploadFaceItems.length"
              class="mt-4 rounded-md border border-dashed border-defaultborder p-8 text-center text-sm text-textmuted">
              ยังไม่ได้เลือกรูป
            </div>
            <p class="mt-3 mb-0 text-center text-sm text-defaulttextcolor">{{ faceStatus }}</p>
          </div>
        </div>
      </div>
      <div class="ti-modal-footer">
        <button #closeModalFace type="button" class="hs-dropdown-toggle ti-btn ti-btn-light align-middle"
          data-hs-overlay="#modal-face" (click)="closeFaceEnrollModal()">
          ยกเลิก
        </button>
        <button type="button" class="ti-btn bg-primary text-white !font-medium"
          [disabled]="isUploadingFace || !selectModel.member.memberId || (faceEnrollMode === 'camera' ? (!allAnglesCaptured && !isFaceDetected) : !uploadFaceItems.length)"
          (click)="captureImage()">
          <ng-container *ngIf="isUploadingFace">{{ uploadProgressLabel || 'กำลังบันทึก...' }}</ng-container>
          <ng-container *ngIf="!isUploadingFace && faceEnrollMode === 'upload'">
            บันทึก {{ uploadFaceItems.length || '' }} รูป
          </ng-container>
          <ng-container *ngIf="!isUploadingFace && faceEnrollMode === 'camera' && allAnglesCaptured">บันทึก 5 มุม</ng-container>
          <ng-container *ngIf="!isUploadingFace && faceEnrollMode === 'camera' && !allAnglesCaptured">ถ่ายมุมนี้</ng-container>
        </button>
      </div>
    </div>
  </div>
</div>
