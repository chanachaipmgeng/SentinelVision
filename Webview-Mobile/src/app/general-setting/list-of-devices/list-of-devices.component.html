<div class="card shadow-sm mb-1" *ngFor="let item of device.items">
  <div class="card-body">

    <div class="row">
      <div class="col"><b class="text-color-theme">{{item.addedDate | date: "dd/MM/yyyy HH:mm" : "en" }}</b></div>
    </div>
    <div class="row">
      <div class="col-6"><small class="text-secondary">รุ่น</small></div>
      <div class="col-6 text-end"><small class="text-secondary">{{item.deviceModel}}</small></div>
    </div>
    <div class="row">
      <div class="col-6"><small class="text-secondary">{{"Version" | translate}}</small></div>
      <div class="col-6 text-end"><small class="text-secondary">{{item.deviceVersion}}</small></div>
    </div>
    <div class="row">
      <div class="col-6"><small class="text-secondary">หมายเลขโทรศัพท์</small></div>
      <div class="col-6 text-end"><small class="text-secondary">{{item.devicePhone}}</small></div>
    </div>
    <div class="row">
      <div class="col"><small class="text-secondary">หมายเลขเครื่อง</small></div>
      <div class="col-auto text-end"><small class="text-secondary">{{item.deviceNo}}</small></div>
    </div>
    <!-- <div class="row">
      <div class="col-6"><small class="text-secondary">IMEI</small></div>
      <div class="col-6 text-end"><small class="text-secondary">{{item.deviceImei}}</small></div>
    </div> -->
  </div>
</div>
