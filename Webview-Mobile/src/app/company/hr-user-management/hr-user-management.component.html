<div class="form-group form-floating mb-3">
    <input type="text" class="form-control " id="search" placeholder='{{"Search Employee" | translate}}'  [(ngModel)]="search">
    <label class="form-control-label" for="search">{{"Search Employee" | translate}}</label>
    <button type="button" class="text-color-theme tooltip-btn">
        <i class="bi bi-search"></i>
    </button>
</div>

<div class="row">
    <div class="col-12">
        <div class="card shadow-sm mb-4">
            <ul class="list-group list-group-flush bg-none">
                <li class="list-group-item" *ngFor="let item of employeeFilter() ">
                    <div class="row">
                        <div class="col-auto cp d-flex align-items-center">
                            <figure class="avatar avatar-70 rounded-10 shadow-sm">
                                <img *ngIf="item.profilePictureFileName != '' ;else personblank"
                                    [src]="item.profilePictureFileName" alt="">
                                <ng-template #personblank>
                                    <img src="assets/img/icon/person.png" alt="">
                                </ng-template>
                            </figure>
                        </div>
                        <div class="col px-0 cp">
                            <p>{{item.firstName+" "+item.lastName}}<br>
                                <small class="text-muted">{{item.positionName}}</small><br>
                                <small class="text-muted">{{item.departmentName}}</small>
                            </p>
                        </div>
                        <div class="col-auto d-flex align-items-center">
                            <button class="btn btn-44 btn-light text-danger shadow-sm" style="margin-right: 5px;"
                                (click)="deleteHr(item)">
                                <i class="bi bi-trash"></i>
                            </button>
                            <!-- <button class="btn btn-44 btn-light text-success shadow-sm"
                                [routerLink]="'/company/hr-user-management-edit/'+item.memberId">
                                <i class="bi bi-pencil-square"></i>
                            </button> -->
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>
<div class="row position-fixed add-buttom justify-content-end">
    <div class="mx-0">
        <div class="col-auto">
            <button class="btn btn-primary rounded-15" type="button" routerLink="/company/hr-user-management-add">
                <i class="bi bi-plus"></i>
            </button>
        </div>
    </div>
</div>
