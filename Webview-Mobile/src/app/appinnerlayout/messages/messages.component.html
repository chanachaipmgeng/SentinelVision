<!-- chat user list -->
<div class="container chat-list scroll-y">
  <div class="row no-margin" *ngFor="let chat of chatMessages"
    [ngClass]="{'right-chat': chat.sender === 'ME', 'left-chat': chat.sender === 'AI'}">
    <div class="col-12">
      <div class="chat-block">
        <div class="row">
          <div class="col">
            <!-- ตรวจสอบว่าผู้ส่งเป็น AI หรือไม่ -->
            <ng-container *ngIf="chat.sender === 'AI'; else regularMessage">
              <!-- ใช้ innerHTML สำหรับข้อความจาก AI -->
              <p [innerHTML]="chat.message"></p>
            </ng-container>
            <!-- กรณีที่ไม่ใช่ AI -->
            <ng-template #regularMessage>
              <p>{{ chat.message }}</p>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 text-end">
      <p class="text-muted small time"><i class="bi bi-check-all text-primary"></i>{{ chat.timestamp | date:'shortTime'
        }}</p>
    </div>

  </div>

  <div class="col-12 text-center" *ngIf="loadingMsg">
    <div class="spinner-grow text-info spinner-grow-sm m-2" role="status" *ngFor="let item of [1,2,3,4,5]">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</div>
<br><br><br><br>
<!-- chat message post -->
<div class="position-fixed bottom-0 start-0 chat-post footer py-3">
  <div class="row mx-0">
    <!-- <div class="col-auto">
            <button class="btn btn-primary rounded-15" type="button" data-bs-toggle="modal" data-bs-target="#attachefiles">
                <i class="bi bi-plus"></i>
            </button>
        </div> -->
    <div class="col ps-0">
      <div class="input-group">
        <input #messageInput type="text" class="form-control" placeholder="Write your message" [disabled]="loadingMsg">
        <button class="btn btn-outline-primary" type="button" [disabled]="loadingMsg"
          (click)="sentMsg(messageInput.value); messageInput.value=''"><i class="bi bi-cursor"></i></button>
      </div>
    </div>
  </div>

</div>
<!-- chat message post page -->
