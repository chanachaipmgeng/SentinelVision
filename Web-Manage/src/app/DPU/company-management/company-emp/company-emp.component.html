<app-page-header [title]="'Employees'" [activeTitle]="'Manage companies'" [title1]="'Employees'"></app-page-header>

<div class="emp-page grid grid-cols-12 gap-x-6 gap-y-4">
  <div class="col-span-12">
    <div class="box emp-toolbar modern-card glass animate-in fade-in slide-in-from-bottom-4 duration-500">
      <div class="box-header emp-toolbar-header">
        <div class="emp-toolbar-inner">
          <div class="emp-toolbar-title">
            <div class="box-title !mb-0">{{ 'Employee' | translate }}</div>
            <span class="emp-stat-chip">{{ 'All' | translate }} {{ serverTotal }}</span>
            <span class="emp-stat-chip emp-stat-chip--soft" *ngIf="searchTerm">{{ 'Found' | translate }} {{ totalFiltered }}</span>
            <span class="emp-stat-chip emp-stat-chip--soft" *ngIf="listLoading">{{ 'Loading...' | translate }}</span>
          </div>

          <div class="emp-toolbar-controls">
            <div class="emp-search">
              <i class="ri-search-line emp-search-icon" aria-hidden="true"></i>
              <input [(ngModel)]="searchTerm" class="form-control emp-search-input" type="search"
                placeholder="{{ 'Search employees' | translate }}" [attr.aria-label]="'Search employees' | translate">
            </div>

            <div class="emp-toolbar-btns">
              <div class="emp-view-toggle" role="group" [attr.aria-label]="'Toggle view' | translate">
                <button type="button" class="emp-view-btn" [attr.title]="'Table view' | translate"
                  [class.active]="listViewMode === 'table'"
                  (click)="setListViewMode('table')">
                  <i class="ri-table-line"></i>
                </button>
                <button type="button" class="emp-view-btn" [attr.title]="'Card view' | translate"
                  [class.active]="listViewMode === 'cards'"
                  (click)="setListViewMode('cards')">
                  <i class="ri-layout-grid-line"></i>
                </button>
              </div>
              <button type="button" class="ti-btn ti-btn-success-full modern-btn emp-tool-btn"
                [disabled]="isImporting" (click)="downloadImportTemplate()">
                <i class="ri-file-excel-2-line"></i>
                <span class="emp-tool-label">{{ 'Template' | translate }}</span>
              </button>
              <button type="button" class="ti-btn ti-btn-info-full modern-btn emp-tool-btn"
                [disabled]="isImporting" (click)="triggerImportFile()">
                <i *ngIf="!isImporting" class="ri-upload-2-line"></i>
                <span *ngIf="isImporting" class="ti-spinner animation-spin !w-4 !h-4" role="status"></span>
                <span class="emp-tool-label">{{ (isImporting ? 'Importing...' : 'Import') | translate }}</span>
              </button>
              <input #importFileInput type="file" class="hidden"
                accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                (change)="onImportFileSelected($event)">
              <input #importPhotosInput type="file" class="hidden"
                accept=".zip,application/zip,application/x-zip-compressed"
                (change)="onImportPhotosSelected($event)">
              <button type="button"
                class="hs-dropdown-toggle ti-btn ti-btn-primary-full modern-btn emp-tool-btn emp-tool-btn--primary"
                (click)="new()" data-hs-overlay="#modal-detail">
                <i class="ri-add-line"></i>
                <span class="emp-tool-label">{{ 'Create' | translate }}</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-span-12">
    <app-emp-list
      [listViewMode]="listViewMode"
      [filterList]="filterList"
      [totalFiltered]="totalFiltered"
      [searchTerm]="searchTerm"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageStart]="pageStart"
      [pageEnd]="pageEnd"
      (viewItem)="view($event)"
      (deleteItem)="delete($event)"
      (enrollFace)="openFaceEnroll($event)"
      (manageFace)="openFaceManagementModal($event)"
      (goToPage)="goToPage($event)"
      (nextPage)="nextPage()"
      (prevPage)="prevPage()"
    ></app-emp-list>
  </div>
</div>

<app-emp-detail-modal
  #detailModal
  [selectModel]="selectModel"
  [itemsList]="itemsList"
  [departmentList]="departmentList"
  [positionList]="positionList"
  [uploaderProfile]="uploaderProfile"
  (save)="save()"
></app-emp-detail-modal>

<app-emp-face-enroll-modal
  #faceEnrollModal
  [companyId]="companyId"
  [selectModel]="selectModel"
></app-emp-face-enroll-modal>

<div id="modal-face-management" class="hs-overlay hidden ti-modal [--overlay-backdrop:false]">
  <div class="hs-overlay-open:mt-7 ti-modal-box mt-0 ease-out max-w-4xl">
    <div class="ti-modal-content">
      <div class="ti-modal-header">
        <div>
          <h6 class="modal-title text-[1rem] font-semibold text-defaulttextcolor !mb-0">{{ 'Manage enrolled faces' | translate }}</h6>
          <p class="mb-0 text-xs text-dpu-muted" *ngIf="selectedMemberName">{{ selectedMemberName }}</p>
        </div>
        <button type="button" class="hs-dropdown-toggle !text-[1rem] !font-semibold !text-defaulttextcolor" data-hs-overlay="#modal-face-management">
          <span class="sr-only">Close</span>
          <i class="ri-close-line"></i>
        </button>
      </div>
      <div class="ti-modal-body px-4 max-h-[75vh] overflow-y-auto">
        <app-face-management
          *ngIf="selectedMemberId"
          [memberId]="selectedMemberId"
          [memberName]="selectedMemberName">
        </app-face-management>
      </div>
      <div class="ti-modal-footer">
        <button type="button" class="hs-dropdown-toggle ti-btn ti-btn-light align-middle" data-hs-overlay="#modal-face-management">
          {{ 'Close' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>

<app-emp-import-overlay
  [isImporting]="isImporting"
  [progress]="importProgress"
  [statusText]="importStatusText"
></app-emp-import-overlay>
