<!-- Search -->
<div class="form-group form-floating mb-3">
  <input type="text" class="form-control " id="search" placeholder="Search" [(ngModel)]="search">
  <label class="form-control-label" for="search">{{"Search Company" | translate}}</label>
  <button type="button" class="text-color-theme tooltip-btn">
    <i class="bi bi-search"></i>
  </button>
</div>

<!-- User list items  -->
<div class="row">
  <div class="col-6 col-sm-4 col-md-3" *ngFor="let item of filterCompany(companyList)">
    <div class="card mb-4 shadow-sm" style="height: 90%;">
      <div class="card-body text-center">
        <div class="row align-items-center ">
          <a (click)="selectCompany(item)" class="col">
            <figure class="avatar avatar-80 mx-auto mb-3 rounded-circle shadow">
              <img src="{{item.getPicture()}}" alt="">
            </figure>
          </a>
        </div>
        <p class="mb-1 text-color-theme text-center">{{item.companyName}}</p>
        <p class="text-small text-muted small">{{item.companyCode}}</p>
      </div>
    </div>
  </div>

</div>
