<!-- Sidebar main menu -->
<app-sidebar class="sidebar-wrap sidebar-fullmenu dpu-sidebar"></app-sidebar>

<main #mainPage class="dpu-shell">
  <app-headermenu class="header position-fixed dpu-header" #HeaderEl></app-headermenu>

  <div class="main-container container dpu-main dpu-page" [@routeAnimations]="o.isActivated && o.activatedRoute.routeConfig?.path">
    <router-outlet #o="outlet"></router-outlet>
  </div>
</main>

<app-staticfooter class="footer dpu-footer" #FooterEl></app-staticfooter>
