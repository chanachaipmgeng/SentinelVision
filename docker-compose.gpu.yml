# Enable NVIDIA GPU for API (AI_VISION-style). Requires Docker Desktop GPU + NVIDIA driver/WSL.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build api
services:
  api:
    environment:
      FACE_DEVICE: "${FACE_DEVICE:-cuda:0}"
      FACE_DEVICES: "${FACE_DEVICES:-cuda:0}"
      FACE_GPU_WORKERS: "${FACE_GPU_WORKERS:-1}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
