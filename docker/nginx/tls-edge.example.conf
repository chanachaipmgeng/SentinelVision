# Example HOST nginx for TLS termination in front of dpu-nginx.
# 413 on https://face-in.myhr.co.th/employees/.../import is almost always this
# layer still using nginx's default client_max_body_size 1m.
#
# Adjust ssl_certificate paths and proxy_pass port (Docker HTTP_PORT, often 80).
# Then:
#   sudo cp docker/nginx/tls-edge.example.conf /etc/nginx/sites-available/face-in.myhr.co.th
#   sudo ln -sf /etc/nginx/sites-available/face-in.myhr.co.th /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name face-in.myhr.co.th;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name face-in.myhr.co.th;

    ssl_certificate     /etc/letsencrypt/live/face-in.myhr.co.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/face-in.myhr.co.th/privkey.pem;

    client_max_body_size 500m;

    location /face/ws/ {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 500m;
    }
}
