apiVersion: 1

# Provisioned whenever the observability overlay mounts grafana/provisioning.
# Needs docker-compose.loki.yml for the Loki service; otherwise Explore shows a connection error.
datasources:
  - name: Loki
    uid: dpu-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
