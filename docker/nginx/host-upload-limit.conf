# Drop this onto the HOST TLS nginx (in front of Docker), not into dpu-nginx:
#
#   sudo cp docker/nginx/host-upload-limit.conf /etc/nginx/conf.d/dpu-upload-limit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ubuntu/Debian include /etc/nginx/conf.d/*.conf from http{}, so this raises the
# 1m default that returns 413 on POST /employees/.../import.
#
# If your site file already has client_max_body_size, set it to 500m there too.
client_max_body_size 500m;
