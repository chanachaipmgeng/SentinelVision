<!-- user information -->
<div class="card shadow-sm mb-4">
    <div [ngClass]="{'card-header':!hideUploandImg,'card-body':hideUploandImg}">
        <div class="row">
            <div class="col-auto">
                <figure class="avatar avatar-70 rounded-10">
                    <img *ngIf="profilePhotoFileName != '' ;else personblank" src="{{profilePhotoFileName}}">
                    <ng-template #personblank>
                        <img src="assets/img/icon/person.png">
                    </ng-template>
                </figure>
            </div>
            <div class="col px-0 align-self-center">
                <h3 class="mb-0 text-color-theme">{{memberModel.member.firstName + " " + memberModel.member.lastName}}</h3>
            </div>
            <div class="col-auto">
                <a (click)="showHideUploandImg()" class="btn btn-44 btn-light shadow-sm">
                    <i class="bi bi-camera"></i>
                </a>
            </div>
        </div>
    </div>
    <div class="card-body" *ngIf="!hideUploandImg">
        <div class="row">
            <div class="col-12">
                <div class="form-group form-floating">
                    <input type="file" class="input-upload" id="fileupload" ng2FileSelect [uploader]="uploader"
                        (change)="onFileSelected($event)">
                    <label for="fileupload"></label>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- profile information -->
<div class="row mb-3">
    <div class="col">
        <h6>{{"Profile Info" | translate}}</h6>
    </div>
</div>
<div class="row h-100 mb-4">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3 "
            [ngClass]="{'is-valid': memberModel.member.email,'is-invalid':!memberModel.member.email}">
            <input type="text" class="form-control" id="email" placeholder="{{'E-mail' | translate}}"
                [(ngModel)]="memberModel.member.email">
            <label for="email">{{'E-mail' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="{{'Please enter email' | translate}}" *ngIf="!memberModel.member.email">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3"
            [ngClass]="{'is-valid': memberModel.member.firstName,'is-invalid':!memberModel.member.firstName}">
            <input type="text" class="form-control" id="firstname" placeholder="{{'Name' | translate}}"
                [(ngModel)]="memberModel.member.firstName">
            <label for="firstname">{{'Name' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="{{'Please enter name' | translate}}" *ngIf="!memberModel.member.firstName">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3"
            [ngClass]="{'is-valid': memberModel.member.lastName,'is-invalid':!memberModel.member.lastName}">
            <input type="text" class="form-control" id="lastname" placeholder="{{'Surname' | translate}}"
                [(ngModel)]="memberModel.member.lastName">
            <label for="lastname">{{'Surname' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="{{'Please enter surname' | translate}}" *ngIf="!memberModel.member.lastName">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3"
            [ngClass]="{'is-valid': memberModel.member.phoneNumber}">
            <input type="text" class="form-control" id="phone" placeholder="{{'Mobile Number' | translate}}"
                [(ngModel)]="memberModel.member.phoneNumber">
            <label for="phone">{{'Mobile Number' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="{{'Please enter mobile number' | translate}}"
                *ngIf="!memberModel.member.phoneNumber">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
    </div>


</div>
<div class="row h-100 ">
    <div class="col-12 mb-4">
        <button class="btn btn-default btn-lg w-100" [disabled]="isUpdateDisabled()" (click)="submit()">{{'BUTTON.SUBMIT' | translate}}</button>
    </div>
</div>
