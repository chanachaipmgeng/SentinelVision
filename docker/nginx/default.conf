# Gateway: admin (/) + mobile (/mobile/) + FastAPI

upstream dpu_api {
    server api:8000;
}

upstream dpu_admin {
    server admin:80;
}

upstream dpu_mobile {
    server mobile:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # --- FastAPI (same-origin for Angular baseUrl='') ---
    location ~ ^/(auth|members|companys|company-locations|departments|positions|employees|timestamp|face|api|system|dashboard|images|enrolled_images)(/|$) {
        proxy_pass http://dpu_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /docs {
        proxy_pass http://dpu_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://dpu_api/openapi.json;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://dpu_api/redoc;
        proxy_set_header Host $host;
    }

    # --- Employee mobile app ---
    location /mobile/ {
        proxy_pass http://dpu_mobile/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mobile {
        return 301 /mobile/;
    }

    # --- Admin (default) ---
    location / {
        proxy_pass http://dpu_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
