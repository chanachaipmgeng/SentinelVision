<!-- Search -->
<div class="form-group form-floating mb-3">
    <input type="text" class="form-control " id="search" placeholder="{{'Search' | translate}}" [(ngModel)]="search">
    <label class="form-control-label" for="search">{{"Search" | translate}}</label>
    <button type="button" class="text-color-theme tooltip-btn">
        <i class="bi bi-search"></i>
    </button>
</div>


<div class="row">
    <div class="col-12">
        <div class="card shadow-sm mb-4">
            <ul class="list-group list-group-flush bg-none">
                <li class="list-group-item" *ngFor="let item of positionListFilter(positionModel)">
                    <div class="row">
                        <div class="col cp">
                            <p>{{item.getName()}}
                            </p>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-44 btn-light text-danger shadow-sm" style="margin-right: 5px;"
                                (click)="deletePosition(item)">
                                <i class="bi bi-trash"></i>
                            </button>
                            <button class="btn btn-44 btn-light text-success shadow-sm" (click)="addPositionOpen(addPosition , item)">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>

<div class="row position-fixed add-buttom justify-content-end">
    <div class="mx-0">
        <div class="col-auto">
            <button class="btn btn-primary rounded-15" type="button" (click)="addPositionOpen(addPosition)">
                <i class="bi bi-plus"></i>
            </button>
        </div>
    </div>
</div>

<ng-template #addPosition let-modal>
    <div class="modal-header">
        <h6 class="modal-title" ngbAutofocus>{{headModal | translate}}</h6>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body p-0 my-3">
        <div class="row m-0 mb-3">
            <div class="col">
                <h6>{{"Position Info" | translate}}</h6>
            </div>
        </div>
        <div class="row h-100 m-0 mb-4">
            <div class="col-12">
                <div class="col-12 form-group form-floating mb-3 ">
                    <input type="text" class="form-control" id="positionName"
                        placeholder="{{'Position Name' | translate}}" [(ngModel)]="positionName">
                    <label for="positionName">{{'Position Name' | translate}}</label>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer p-0 justify-content-around modal-footer-height">
        <button type="button" class="col-5 btn btn-danger rounded-15 btn-model" (click)="modal.dismiss()">
            {{"BUTTON.Cancel" | translate}}
        </button>
        <button type="button" class="col-5 btn btn-primary rounded-15 btn-model" [disabled]="!positionName"
            (click)="modal.close()">
            {{"BUTTON.SUBMIT" | translate}}
        </button>
    </div>
</ng-template>
