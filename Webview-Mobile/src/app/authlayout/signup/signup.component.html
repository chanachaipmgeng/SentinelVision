<div class="row h-100 overflow-auto">
    <div class="col-12 text-center mb-auto px-0">
        <header class="header">
            <div class="row">
                <div class="col-auto">
                    <a routerLink="/auth/signin" target="_self" class="btn btn-light btn-44">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                </div>
                <div class="col align-self-center">
                    <h5>{{"Sign up" |translate}}</h5>
                </div>
                <div class="col-auto">
                    <a class="btn btn-light btn-44 invisible"></a>
                </div>
            </div>
        </header>
    </div>
    <!-- main page content -->
    <main #mainPage>
        <div class="main-container container">
            <div class="clearfix"></div>
            <div class="row h-100 mt-3 justify-content-center">
                <!-- user information -->
                <div class="card shadow-sm mb-4">
                    <div [ngClass]="{'card-header':!hideUploandImg,'card-body':hideUploandImg}">
                        <div class="row align-items-center">
                            <div class="col-auto">
                                <figure class="avatar avatar-70 rounded-10">
                                    <img *ngIf="profilePhotoFileName != '' ;else personblank"
                                        src="{{profilePhotoFileName}}">
                                    {{profilePhotoFileName}}
                                    <ng-template #personblank>
                                        <img src="assets/img/icon/person.png">
                                    </ng-template>
                                </figure>
                            </div>
                            <div class="col px-0 align-self-center">
                                <h3 class="mb-0 text-color-theme">{{firstName+(firstName?" ":"")+lastName}}
                                </h3>
                            </div>
                            <div class="col-auto">
                                <a (click)="showHideUploandImg()" class="btn btn-44 btn-light shadow-sm">
                                    <i class="bi bi-camera"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="card-body" *ngIf="!hideUploandImg">
                        <div class="row">
                            <div class="col-12">
                                <div class="form-group form-floating">
                                    <input type="file" class="input-upload" id="fileupload" ng2FileSelect
                                        [uploader]="uploader" (change)="onFileSelected($event)">
                                    <label for="fileupload"></label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- profile information -->
                <div class="row mb-3">
                    <div class="col">
                        <h6>{{"Register Info" | translate}}</h6>
                    </div>
                </div>
                <div class="row h-100 mb-4">
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="form-group form-floating mb-3 " [ngClass]="{'is-valid': email,'is-invalid':!email}">
                            <input type="text" class="form-control" id="email" placeholder="{{'E-mail' | translate}}"
                                [(ngModel)]="email">
                            <label for="email">{{'E-mail' | translate}}</label>
                            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                                data-bs-placement="left" title="{{'Please enter email' | translate}}" *ngIf="!email">
                                <i class="bi bi-info-circle"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="form-group form-floating mb-3"
                            [ngClass]="{'is-valid': password,'is-invalid':!password}">
                            <input type="text" class="form-control" id="password"
                                placeholder="{{'Password' | translate}}" [(ngModel)]="password">
                            <label for="password">{{'Password' | translate}}</label>
                            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                                data-bs-placement="left" title="{{'Please enter password' | translate}}"
                                *ngIf="!password">
                                <i class="bi bi-info-circle"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="form-group form-floating mb-3"
                            [ngClass]="{'is-valid': mobileNumber,'is-invalid':!mobileNumber}">
                            <input type="text" class="form-control" id="phone"
                                placeholder="{{'Mobile Number' | translate}}" [(ngModel)]="mobileNumber">
                            <label for="phone">{{'Mobile Number' | translate}}</label>
                            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                                data-bs-placement="left" title="{{'Please enter mobile number' | translate}}"
                                *ngIf="!mobileNumber">
                                <i class="bi bi-info-circle"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="form-group form-floating mb-3"
                            [ngClass]="{'is-valid': firstName,'is-invalid':!firstName}">
                            <input type="text" class="form-control" id="firstname" placeholder="{{'Name' | translate}}"
                                [(ngModel)]="firstName">
                            <label for="firstname">{{'Name' | translate}}</label>
                            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                                data-bs-placement="left" title="{{'Please enter name' | translate}}" *ngIf="!firstName">
                                <i class="bi bi-info-circle"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="form-group form-floating mb-3"
                            [ngClass]="{'is-valid': lastName,'is-invalid':!lastName}">
                            <input type="text" class="form-control" id="lastname"
                                placeholder="{{'Surname' | translate}}" [(ngModel)]="lastName">
                            <label for="lastname">{{'Surname' | translate}}</label>
                            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                                data-bs-placement="left" title="{{'Please enter surname' | translate}}"
                                *ngIf="!lastName">
                                <i class="bi bi-info-circle"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="form-floating mb-3 is-valid">
                            <select class="form-control" id="sex" [(ngModel)]="sex">
                                <option [value]="0">{{'Men' | translate}}</option>
                                <option [value]="1">{{'Women' | translate}}</option>
                                <option [value]="2">{{'Not specified' | translate}}</option>
                            </select>
                            <label for="sex">{{'Sex' | translate}}</label>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="form-group form-floating  mb-3 is-valid">
                            <input type="date" class="form-control" id="birthday"
                                placeholder="{{'Birthday' | translate}}" [(ngModel)]="birthDate">
                            <label for="birthday">{{'Birthday' | translate}}</label>
                        </div>
                        {{birthDate}}
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="form-group form-floating  mb-3 is-valid">
                            <input type="text" class="form-control" id="idcard"
                                placeholder="{{'ID card number' | translate}}" [(ngModel)]="idCard">
                            <label for="idcard">{{'ID card number' | translate}}</label>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="form-group form-floating  mb-3 is-valid">
                            <input type="text" class="form-control" id="passport"
                                placeholder="{{'Passport number' | translate}}" [(ngModel)]="passportNo">
                            <label for="passport">{{'Passport number' | translate}}</label>
                        </div>
                    </div>
                </div>
                <div class="row h-100 ">
                    <div class="col-12 mb-4">
                        <button class="btn btn-default btn-lg w-100" [disabled]="isUpdateDisabled()"
                            (click)="submit()">{{'Register' | translate}}</button>
                    </div>
                </div>
            </div>
            <div class="clearfix"></div>
        </div>
    </main>
</div>
