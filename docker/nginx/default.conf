# Gateway: admin (/) + FastAPI — single API upstream (CPU, single GPU, BFF).
# Uses Docker embedded DNS via a variable so the upstream IP refreshes after recreate
# (a plain `upstream { server api:8000; }` is resolved once at start → stale 502).
# Routing, rate limits, internal-only endpoints and security headers live in
# snippets/gateway.conf and are identical for the dual / quad / hexa variants.

server {
    set $dpu_api http://api:8000;
    include /etc/nginx/snippets/gateway.conf;
}
