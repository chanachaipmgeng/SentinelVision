<aside class="app-sidebar sv-dual-sidebar" id="sidebar" [ngClass]="{ 'sticky-pin': scrolled }">

  <!-- Start::main-sidebar-header -->
  <div class="main-sidebar-header">
    <a class="header-logo dpu-sidebar-brand"
      [routerLink]="isInstallerRoute ? '/company/dashboard' : '/admin/home'"
      aria-label="Sentinel by IVAP Home">
      <img
        class="desktop-dark dpu-sidebar-logo"
        src="./assets/images/brand-logos/ivap-logo-light.png"
        alt="IVAP">
      <img
        class="toggle-white dpu-sidebar-logo"
        src="./assets/images/brand-logos/ivap-logo-light.png"
        alt="IVAP">
      <span class="dpu-sidebar-brand-text">
        <span class="dpu-sidebar-brand-name">Sentinel</span>
        <span class="dpu-sidebar-brand-by">by IVAP</span>
      </span>
    </a>
  </div>

  <!-- Two-Column Dual-Rail Body -->
  <div class="sv-dual-body">
    <!-- Column 1: Primary Modules Rail -->
    <nav class="sv-rail" aria-label="โมดูลหลัก">
      <button
        *ngFor="let grp of moduleGroups"
        type="button"
        class="sv-rail__btn"
        [class.is-active]="grp.id === activeModuleGroup?.id"
        [style.--mod-rgb]="grp.accentRgb"
        [title]="grp.title | translate"
        [attr.aria-label]="grp.shortLabel"
        [attr.aria-current]="grp.id === activeModuleGroup?.id ? 'true' : null"
        (click)="selectModule(grp)">
        <span class="sv-rail__icon">
          <i [class]="grp.icon" aria-hidden="true"></i>
        </span>
        <span class="sv-rail__label">{{ grp.shortLabel }}</span>
      </button>
    </nav>

    <!-- Column 2: Active Module Sub-Screens -->
    <div class="sv-subpanel" *ngIf="activeModuleGroup as mod" [style.--mod-rgb]="mod.accentRgb">
      <ngx-simplebar [options]="options" class="sv-subpanel__scroll" id="sidebar-scroll">
        <!-- Company Switcher Card (inside subpanel) -->
        <div class="box custom-box dpu-company-card mx-2 mt-2 mb-2" *ngIf="isInstallerRoute">
          <div class="box-body !p-2.5">
            <div class="dpu-company-card__row">
              <span class="avatar avatar-sm !rounded-full bg-white/90 shadow-sm border border-white/20 p-0.5 shrink-0">
                <img [src]="tokenService.getSelectCompany().getPicture()" alt="">
              </span>
              <div class="dpu-company-card__meta min-w-0">
                <h5 class="font-semibold mb-0 truncate text-[0.78rem]" [title]="tokenService.getSelectCompany().companyName">
                  {{ tokenService.getSelectCompany().companyName }}
                </h5>
                <p class="mb-0 truncate text-[0.68rem]">{{ tokenService.getSelectCompany().companyCode }}</p>
              </div>
            </div>
            <a routerLink="/company/company-info" class="dpu-company-card__link" (click)="menuOpen()">
              {{ 'Company info' | translate }} <i class="ri-arrow-right-line"></i>
            </a>
          </div>
        </div>

        <!-- Module Header -->
        <div class="sv-subpanel__head">
          <span class="sv-subpanel__badge">
            <i [class]="mod.icon" aria-hidden="true"></i>
            {{ mod.shortLabel }}
          </span>
          <p class="sv-subpanel__title">{{ mod.title | translate }}</p>
        </div>

        <!-- Module Sub-Screens List -->
        <ul class="sv-subpanel__list">
          <li *ngFor="let item of mod.items">
            <a
              class="sv-subitem"
              [routerLink]="item.path ? [item.path] : null"
              [class.is-active]="isSubItemActive(item)"
              (click)="menuOpen()">
              <span class="sv-subitem__dot" aria-hidden="true"></span>
              <span class="sv-subitem__text">{{ item.title | translate }}</span>
              <span
                *ngIf="item.badgeValue"
                class="badge !bg-{{ item.badgeClass || 'primary' }}/15 !text-{{ item.badgeText || 'primary' }} !py-[0.15rem] !px-[0.4rem] !text-[0.65rem] ms-auto shrink-0">
                {{ item.badgeValue }}
              </span>
            </a>
          </li>
        </ul>
      </ngx-simplebar>
    </div>
  </div>
</aside>
