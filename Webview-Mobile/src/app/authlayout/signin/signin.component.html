<div class="dpu-auth">
  <div class="dpu-auth__panel">
    <div class="dpu-auth__brand">
      <img src="assets/img/icon/logo2.png" alt="Time Attendance">
      <h1>Time Attendance</h1>
      <p>เข้าสู่ระบบพนักงาน</p>
    </div>

    <form class="needs-validation" novalidate (submit)="onSubmit()">
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="email"
          placeholder="Username"
          [(ngModel)]="username"
          [ngModelOptions]="{ standalone: true }"
          (ngModelChange)="msg = ''">
        <label for="email">Username</label>
      </div>

      <div class="form-floating mb-2 position-relative">
        <input
          [type]="PassWord ? 'text' : 'password'"
          class="form-control"
          id="password"
          placeholder="Password"
          [(ngModel)]="password"
          [ngModelOptions]="{ standalone: true }"
          (ngModelChange)="msg = ''">
        <label for="password">Password</label>
        <button type="button" class="dpu-auth__eye" (click)="showPassWord()" *ngIf="password">
          <i class="bi" [ngClass]="PassWord ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>

      <p class="dpu-auth__error" *ngIf="msg">{{ msg }}</p>

      <button type="submit" class="btn btn-default w-100 dpu-auth__submit">
        เข้าสู่ระบบ
      </button>
    </form>
  </div>
</div>
