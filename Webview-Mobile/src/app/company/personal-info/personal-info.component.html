<!-- user information -->
<div class="card shadow-sm mb-4" *ngIf="personalModel">
  <div class="card-header">
    <div class="row">
      <div class="col-auto">
        <figure class="avatar avatar-70 rounded-10">
          <img appShowLoading *ngIf="personalModel.getPicture() != '' ;else personblank"
            src="{{personalModel.getPicture()}}">
          <ng-template #personblank>
            <img appShowLoading src="assets/img/icon/person.png">
          </ng-template>
        </figure>
      </div>
      <div class="col px-0 align-self-center">
        <h3 class="mb-0 text-color-theme">{{personalModel.getFullname()}}</h3>
        <p class="text-muted ">{{personalModel.position.getName()}}</p>
      </div>
      <div class="col-auto">
        <a (click)="hideUploandImg = !hideUploandImg" class="btn btn-44 btn-light shadow-sm">
          <i class="bi bi-camera"></i>
        </a>
      </div>
    </div>
  </div>
  <div class="card-body" *ngIf="hideUploandImg">
    <div class="row">
      <div class="col-12">
        <div class="form-group form-floating">
          <input type="file" class="input-upload" id="fileupload" ng2FileSelect [uploader]="uploaderProfile">
          <label for="fileupload"></label>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row h-100" *ngIf="hideUploandImg">
  <div class="col-12 mb-4">
    <button class="btn btn-default btn-lg w-100" (click)="save()">
      {{'BUTTON.SUBMIT' | translate}}
    </button>
  </div>
</div>
