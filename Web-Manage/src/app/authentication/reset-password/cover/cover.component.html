<div class="dpu-auth">
  <div class="dpu-auth__panel">
    <div class="dpu-auth__brand">
      <img src="./assets/images/brand-logos/logo.png" alt="SentinelVision">
      <h1 class="dpu-auth__title">รีเซ็ตรหัสผ่าน</h1>
      <p class="dpu-auth__subtitle" *ngIf="mode === 'request'">กรอกอีเมลเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</p>
      <p class="dpu-auth__subtitle" *ngIf="mode === 'set'">ตั้งรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>
    </div>

    <div class="grid grid-cols-12 gap-y-4" *ngIf="mode === 'request'">
      <div class="col-span-12">
        <label for="reset-email" class="form-label">Email</label>
        <input type="email" class="form-control" id="reset-email" placeholder="email@example.com" [(ngModel)]="email">
      </div>
      <div class="col-span-12">
        <button type="button" (click)="resetPass()" class="ti-btn ti-btn-primary-full dpu-auth__submit" [disabled]="busy">
          ส่งคำขอรีเซ็ต
        </button>
      </div>
      <div class="col-span-12 text-center">
        <p class="text-dpu-muted text-[0.85rem] mt-2">
          มีบัญชีอยู่แล้ว? <a routerLink="/auth/login" class="text-primary font-semibold">{{ 'Sign in' | translate }}</a>
        </p>
      </div>
    </div>

    <div class="grid grid-cols-12 gap-y-4" *ngIf="mode === 'set'">
      <div class="col-span-12">
        <label for="new-password" class="form-label">รหัสผ่านใหม่</label>
        <input type="password" class="form-control" id="new-password" [(ngModel)]="newPassword" autocomplete="new-password">
      </div>
      <div class="col-span-12">
        <label for="confirm-password" class="form-label">ยืนยันรหัสผ่าน</label>
        <input type="password" class="form-control" id="confirm-password" [(ngModel)]="confirmPassword" autocomplete="new-password">
      </div>
      <div class="col-span-12">
        <button type="button" (click)="submitNewPassword()" class="ti-btn ti-btn-primary-full dpu-auth__submit" [disabled]="busy">
          บันทึกรหัสผ่านใหม่
        </button>
      </div>
      <div class="col-span-12 text-center">
        <p class="text-dpu-muted text-[0.85rem] mt-2">
          <a routerLink="/auth/login" class="text-primary font-semibold">กลับไปเข้าสู่ระบบ</a>
        </p>
      </div>
    </div>
  </div>
</div>
