<!-- Search -->
<div class="form-group form-floating mb-3">
  <input type="text" class="form-control " id="search" placeholder="{{'Search Subordinate' | translate}}" [(ngModel)]="search">
  <label class="form-control-label" for="search">{{"Search Subordinate" | translate}}</label>
  <button type="button" class="text-color-theme tooltip-btn">
    <i class="bi bi-search"></i>
  </button>
</div>


<div class="row">
  <div class="col-12">
    <div class="card shadow-sm mb-4">
      <ul class="list-group list-group-flush bg-none">
        <li class="list-group-item" *ngFor="let item of subordinateListFilter(subordinateList) ">
          <div class="row">
            <div class="col-auto d-flex align-items-center"
              (click)="routerLink('/company/employee-menu/'+item.member.memberId)">
              <figure class="avatar avatar-50 rounded-10 shadow-sm">
                <img appShowLoading *ngIf="item.getPicture() != '' ;else personblank" [src]="item.getPicture()" alt="">
                <ng-template #personblank>
                  <img src="assets/img/icon/person.png" alt="">
                </ng-template>
              </figure>
            </div>
            <div class="col px-0 align-items-center" (click)="routerLink('/company/employee-menu/'+item.member.memberId)">
              <h5 class="color-text-menu">{{ item.getFullname() }}
              </h5>
              <p class="text-color-theme mb-0">{{item.employeeId}}</p>
              <small class="text-muted">{{item.position.getName()}}</small>
            </div>
            <!-- <div class="col-auto text-end">
                            <p>
                                <small class="text-muted size-12">Online <span
                                        class="avatar avatar-6 rounded-circle bg-success d-inline-block"></span></small>
                            </p>
                        </div> -->
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
