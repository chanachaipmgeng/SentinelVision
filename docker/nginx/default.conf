# Gateway: admin (/) + mobile (/mobile/) + FastAPI
# Use Docker embedded DNS so upstream IPs refresh after recreate
# (plain `upstream { server api:8000; }` is resolved once at start → stale 502).

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # --- Face kiosk WebSocket (must precede general /face regex) ---
    location ^~ /face/ws/ {
        set $dpu_api http://api:8000;
        proxy_pass $dpu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- FastAPI (same-origin for Angular baseUrl='') ---
    location ~ ^/(auth|members|companys|company-locations|departments|positions|employees|timestamp|face|api|system|dashboard|images|enrolled_images)(/|$) {
        set $dpu_api http://api:8000;
        proxy_pass $dpu_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /docs {
        set $dpu_api http://api:8000;
        proxy_pass $dpu_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        set $dpu_api http://api:8000;
        proxy_pass $dpu_api/openapi.json;
        proxy_set_header Host $host;
    }

    location /redoc {
        set $dpu_api http://api:8000;
        proxy_pass $dpu_api/redoc;
        proxy_set_header Host $host;
    }

    # --- Employee mobile app ---
    location /mobile/ {
        set $dpu_mobile http://mobile:80;
        proxy_pass $dpu_mobile/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mobile {
        return 301 /mobile/;
    }

    # --- Admin (default) ---
    location / {
        set $dpu_admin http://admin:80;
        proxy_pass $dpu_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
