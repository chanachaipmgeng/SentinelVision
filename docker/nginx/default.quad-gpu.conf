# Quad-API gateway: least_conn across 2 processes per GPU.
#   api + api-gpu0b → GPU0, api-gpu1 + api-gpu1b → GPU1.
# Mounted by docker-compose.gpu-x2.yml over default.dual-gpu.conf.
# Routing, rate limits, internal-only endpoints and security headers come from
# snippets/gateway.conf (baked into the image — rebuild nginx when snippets change).

upstream dpu_api {
    least_conn;
    server api:8000 max_fails=5 fail_timeout=10s;
    server api-gpu1:8000 max_fails=5 fail_timeout=10s;
    server api-gpu0b:8000 max_fails=5 fail_timeout=10s;
    server api-gpu1b:8000 max_fails=5 fail_timeout=10s;
}

server {
    set $dpu_api http://dpu_api;
    include /etc/nginx/snippets/gateway.conf;
}
