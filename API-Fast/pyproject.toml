# Lint / type-check configuration for the API (Phase B3 CI gates).
# Run locally from API-Fast/:  ruff check .   |   mypy src   |   python -m pytest -q
# No [build-system]: this package is deployed from source, not built as a wheel.

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["enrolled_images", "uploaded_images", "temp_images", "dist", "*.egg-info"]

[tool.ruff.lint]
# Pyflakes + pycodestyle errors + bugbear. Style/formatting rules are intentionally not
# enforced yet (the codebase predates the gate); add them one family at a time.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  # FastAPI idiom: `db: AsyncSession = Depends(get_db)` in signatures.
  "B008",
]

[tool.ruff.lint.per-file-ignores]
# Module-level sys.path / env setup before imports is deliberate in these entry points.
"scripts/seed_demo_data.py" = ["E402"]
"src/security/oidc.py" = ["E402"]
"tests/test_face_ws_auth_gating.py" = ["E402"]
"tests/test_company_module_config.py" = ["E402"]
"tests/test_kiosk_blacklist_exposure.py" = ["E402"]
"tests/test_sentinel_search_gate.py" = ["E402"]
# DB-backed test modules skip at import time (`pytest.skip(allow_module_level=True)`) before importing src.
"tests/test_authz_matrix.py" = ["E402"]
"tests/test_punch_shift_export.py" = ["E402"]
"tests/test_attendance_summary_shift_rules.py" = ["E402"]
"tests/test_punch_break_holiday.py" = ["E402"]
"tests/test_approvals_payroll.py" = ["E402"]
"tests/test_outbox_claiming.py" = ["E402"]
"tests/test_tenant_isolation.py" = ["E402"]
"tests/test_alembic_schema.py" = ["E402"]
"tests/test_sentinel_muster.py" = ["E402"]
"tests/test_app_startup.py" = ["E402"]
# Re-exports.
"src/models/__init__.py" = ["F401"]
"src/config/schema.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
# The images are Linux; pin the platform so a Windows/macOS laptop reports the same errors as CI
# (e.g. os.getuid in storage_service.ensure_dirs).
platform = "linux"
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = false
show_error_codes = true
pretty = false
exclude = ["^enrolled_images/", "^uploaded_images/", "^temp_images/"]

# ---- Phase B3 baseline -------------------------------------------------------------------
# Narrow post-Mapped[] exceptions only (was 62 modules / ignore_errors).
# face GPU queue call sites pass untyped lambdas; suppress [misc] there only.
[[tool.mypy.overrides]]
module = [
    "src.controllers.face_controller",
    "src.controllers.face_ws_controller",
    "src.controllers.employee_import_controller",
    "src.utils.face_gpu_queue",
]
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:authlib.*",
]
