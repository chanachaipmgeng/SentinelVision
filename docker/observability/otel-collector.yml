# Minimal OpenTelemetry Collector: receive OTLP from dpu-api / dpu-worker, batch, and print a
# summary (debug exporter). Point `exporters` at Tempo / Jaeger / your APM vendor for real use,
# e.g. `otlp: { endpoint: tempo:4317, tls: { insecure: true } }` and add it to the pipeline.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 5s
    limit_mib: 256

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
