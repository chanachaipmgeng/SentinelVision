<div id="modal-detail" class="hs-overlay hidden ti-modal [--overlay-backdrop:false]">
  <div class="hs-overlay-open:mt-7 ti-modal-box mt-0 ease-out">
    <div class="ti-modal-content">
      <div class="ti-modal-header">
        <h6 class="modal-title text-[1rem] font-semibold text-defaulttextcolor" id="mail-ComposeLabel">ข้อมูลพนักงาน
        </h6>
        <button type="button" class="hs-dropdown-toggle !text-[1rem] !font-semibold !text-defaulttextcolor"
          data-hs-overlay="#modal-detail">
          <span class="sr-only">Close</span>
          <i class="ri-close-line"></i>
        </button>
      </div>
      <div class="ti-modal-body px-4">
        <div class="grid grid-cols-12 gap-4">
          <div class="xl:col-span-12 col-span-12">
            <div class="mb-0 text-center">
              <span class="avatar avatar-xxl avatar-rounded">
                <img [src]="selectModel?.getPicture?.() || './assets/images/faces/1.jpg'" alt="" id="profile-img">
                <span class="badge rounded-full bg-primary avatar-badge">
                  <input ng2FileSelect [uploader]="uploaderProfile" type="file" name="photo"
                    class="absolute w-full h-full opacity-[0]" id="profile-change">
                  <i class="fe fe-camera text-[.625rem]"></i>
                </span>
              </span>
            </div>
          </div>
          <div class="xl:col-span-6 col-span-12">
            <label for="deal-name" class="form-label">{{ 'Name' | translate }}</label>
            <input type="text" class="form-control" id="deal-name" placeholder="ชื่อ"
              [(ngModel)]="selectModel.member!.firstName">
          </div>
          <div class="xl:col-span-6 col-span-12">
            <label for="deal-lead-score" class="form-label">{{ 'Last name' | translate }}</label>
            <input type="text" class="form-control" id="deal-lead-score" placeholder="นามสกุล"
              [(ngModel)]="selectModel.member!.lastName">
          </div>
          <div class="xl:col-span-12 col-span-12">
            <label for="company-name" class="form-label">{{ 'Email' | translate }} <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="company-name" placeholder="เช่น name@company.com"
              [(ngModel)]="selectModel.member!.email">
            <p class="text-xs text-textmuted mt-1 mb-0">ต้องเป็นรูปแบบอีเมลจริง เช่น name&#64;company.com (ต้องมี &#64; และจุดในโดเมน)</p>
          </div>
          <div class="xl:col-span-12 col-span-12">
            <label class="form-label">วันเริ่มงาน</label>
            <div class="form-group">
              <div class="input-group">
                <input type="text" class="form-control" id="endDate" placeholder="Choose date with time" mwlFlatpickr
                  [(ngModel)]="selectModel.startDate" [enableTime]="true" [convertModelValue]="true"
                  [dateFormat]="'Y-m-d H:i'">
              </div>
            </div>
          </div>
          <div class="xl:col-span-6 col-span-12">
            <label for="deal-lead-score" class="form-label">รหัสพนักงาน</label>
            <input type="text" class="form-control" id="deal-lead-score" placeholder="รหัสพนักงาน"
              [(ngModel)]="selectModel.employeeId">
          </div>
          <div class="xl:col-span-6 col-span-12">
            <label class="form-label">วันเกิด</label>
            <input type="date" class="form-control" [(ngModel)]="selectModel.member.birthDate">
          </div>
          <div class="xl:col-span-12 col-span-12">
            <label class="form-label">{{ 'Address' | translate }}</label>
            <textarea class="form-control" rows="2" [(ngModel)]="selectModel.member.address"></textarea>
          </div>
          <div class="xl:col-span-6 col-span-12">
            <label class="form-label">ผู้ติดต่อฉุกเฉิน</label>
            <input type="text" class="form-control" [(ngModel)]="selectModel.member.emergencyContactName">
          </div>
          <div class="xl:col-span-6 col-span-12">
            <label class="form-label">เบอร์ติดต่อฉุกเฉิน</label>
            <input type="text" class="form-control" [(ngModel)]="selectModel.member.emergencyContactPhone">
          </div>
          <div class="xl:col-span-6 col-span-12">
            <label for="deal-name" class="form-label">หัวหน้างาน</label>
            <ng-select name="boss-select" id="boss-select" placeholder=""
              appendTo="body"
              [(ngModel)]="selectModel.bossId">
              @for (item of bossOptions(); track item.company_employeeId || item.member.memberId) {
                <ng-option [value]="item.member.memberId">
                  {{ item.member.firstName }} {{ item.member.lastName }}
                </ng-option>
              }
            </ng-select>
          </div>

          <div class="xl:col-span-6 col-span-12">
            <label for="deal-name" class="form-label">{{ 'Department' | translate }}</label>
            <ng-select #select
              [items]="departmentList || []"
              [searchable]="false"
              [compareWith]="compareDepartment"
              appendTo="body"
              [(ngModel)]="selectModel.department"
              bindLabel="thName">
              <ng-template ng-header-tmp>
                <input style="width: 100%; line-height: 24px" type="text"
                  (input)="select.filter($any($event.target).value)" />
              </ng-template>
            </ng-select>
          </div>
          <div class="xl:col-span-6 col-span-12">
            <label for="deal-name" class="form-label">{{ 'Position' | translate }}</label>
            <ng-select #select2
              [items]="positionList || []"
              [searchable]="false"
              [compareWith]="comparePosition"
              appendTo="body"
              [(ngModel)]="selectModel.position"
              bindLabel="thName">
              <ng-template ng-header-tmp>
                <input style="width: 100%; line-height: 24px" type="text"
                  (input)="select2.filter($any($event.target).value)" />
              </ng-template>
            </ng-select>
          </div>
          <div class="xl:col-span-6 col-span-12">
            <label for="deal-name" class="form-label">{{ 'Type' | translate }}</label>
            <ng-select name="emp-type-select" id="emp-type-select" placeholder=""
              appendTo="body"
              [(ngModel)]="selectModel.empType">
              <ng-option [value]="0">รายวัน</ng-option>
              <ng-option [value]="1">รายเดือน</ng-option>
            </ng-select>
          </div>
          <div class="xl:col-span-6 col-span-12">
            <label for="deal-name" class="form-label">{{ 'Salary' | translate }}</label>
            <input type="text" class="form-control" id="company-name" placeholder="เงินเดือน"
              [(ngModel)]="selectModel.salary">
          </div>

          <div class="xl:col-span-6 col-span-12">
            <label for="deal-name" class="form-label">{{ 'Permissions' | translate }}</label>
            <ng-select name="role-select" id="role-select" placeholder=""
              appendTo="body"
              [(ngModel)]="selectModel.companyRoleType">
              <ng-option [value]="0">{{ 'Employee' | translate }}</ng-option>
              <ng-option [value]="1">ผู้ดูแลบริษัท</ng-option>
            </ng-select>
          </div>
        </div>
      </div>
      <div class="ti-modal-footer">
        <button #closeModal type="button" class="hs-dropdown-toggle ti-btn  ti-btn-light align-middle"
          data-hs-overlay="#modal-detail">
          ยกเลิก
        </button>
        <button type="button" class="ti-btn bg-primary text-white !font-medium" (click)="save.emit()">{{ 'Save' | translate }}</button>
      </div>
    </div>
  </div>
</div>
