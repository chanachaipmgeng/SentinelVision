<app-switcher class="dpu-hidden-switcher"></app-switcher>

<div class="page">
  <app-header></app-header>
  <app-sidebar appHoverEffectSidebar></app-sidebar>
  <div class="content">
    <div class="main-content" (click)="togglesidemenuBody()"
      [@routeAnimations]="o.isActivated && o.activatedRoute.routeConfig?.path">
      <app-offline-banner></app-offline-banner>
      <router-outlet #o="outlet"></router-outlet>
    </div>
  </div>
  <app-footer></app-footer>
  <app-tab-to-top></app-tab-to-top>

</div>
<div id="responsive-overlay" (click)="clearToggle()"></div>
<app-command-palette></app-command-palette>
<app-notification-drawer></app-notification-drawer>
