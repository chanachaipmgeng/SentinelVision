<div class="row mb-3">
  <div class="col">
    <h6>{{"General" | translate}}</h6>
  </div>
</div>
<div class="row">
  <div class="col-12">
    <div class="card shadow-sm mb-4">
      <ul class="list-group list-group-flush bg-none">
        <li class="list-group-item">
          <div class="row">
            <div class="col align-self-center">
              <a class="text-normal d-block">
                <i class="bi bi-translate mx-2"></i>
                {{'language' | translate}}</a>
            </div>
            <div class="col-auto align-self-center text-end">
              <ul class="nav nav-pills nav-justified tabs" id="assetstabs" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link" [ngClass]="{'active' : selectedLanguage=='th'}" id="home-tab"
                    data-bs-toggle="tab" data-bs-target="#cards" (click)="changeLanguage('th')" type="button" role="tab"
                    aria-controls="cards" aria-selected="true" style="line-height: 15px;">ไทย</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" [ngClass]="{'active' : selectedLanguage=='en'}" id="currency-tab"
                    data-bs-toggle="tab" data-bs-target="#currency" (click)="changeLanguage('en')" type="button"
                    role="tab" aria-controls="currency" aria-selected="false" style="line-height: 15px;">Eng</button>
                </li>
              </ul>

            </div>

          </div>
        </li>

        <li class="list-group-item">
          <div class="row p-1">
            <a  routerLink="/general/enroll-face" class="text-normal d-block">
              <i class="bi bi-person-bounding-box mx-2"></i>
              {{"Register face" | translate}}
              <i class="float-end bi bi-chevron-right"></i>
            </a>
          </div>
        </li>

        <!-- <li class="list-group-item">
          <div class="row p-1">
            <a routerLink="/general/reset-password" class="text-normal d-block">
              <i class="bi bi-gear mx-2"></i>
              {{"Change Password" | translate}}
              <i class="float-end bi bi-chevron-right"></i>
            </a>
          </div>
        </li> -->

        <li class="list-group-item">
          <div class="row p-1">
            <a routerLink="/general/contact-us" class="text-normal d-block">
              <i class="bi bi-envelope mx-2"></i>
              {{"Contact us" | translate}}
              <i class="float-end bi bi-chevron-right"></i>
            </a>
          </div>
        </li>

        <!-- <li class="list-group-item">

    </div>

</div>
