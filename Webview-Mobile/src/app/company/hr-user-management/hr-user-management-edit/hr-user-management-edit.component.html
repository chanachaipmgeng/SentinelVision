<div class="card shadow-sm mb-4">
    <div class="card-body">
        <div class="row">
            <div class="col-auto">
                <figure class="avatar avatar-70 rounded-10">
                    <img appShowLoading *ngIf="employee.getPicture() ;else personblank" src="{{employee.getPicture()}}">
                    <ng-template #personblank>
                        <img src="assets/img/icon/person.png">
                    </ng-template>
                </figure>
            </div>
            <div class="col px-0 align-self-center">
                <h3 class="mb-0 text-color-theme">{{employee.getFullname()}}</h3>
                <p class="text-muted ">{{employee.position.getName()}}</p>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12 ">
        <div class="card mb-4">
            <div class="card-header border-0">
                <div class="row mb-2 ">
                    <div class="col-auto d-flex align-items-center">
                        <p>Payslip<br>
                            <small class="text-muted">Upload Payslip</small><br>
                        </p>
                    </div>
                    <div class="col d-flex justify-content-end align-content-center">
                        <ul class="nav nav-pills nav-justified tabs" id="paysliptabs" role="tablist" ac>
                            <li class="nav-item" role="presentation" (click)="payslip=true ; payslipChange()">
                                <button class="nav-link" id="payslip-tab" data-bs-toggle="tab"
                                    [ngClass]="{'active': payslip}" data-bs-target="#payslipTrue" type="button"
                                    role="tab" aria-controls="payslipTrue" aria-selected="true">True</button>
                            </li>
                            <li class="nav-item" role="presentation" (click)="payslip=false ; payslipChange()">
                                <button class="nav-link" id="payslip-tab" data-bs-toggle="tab"
                                    [ngClass]="{'active': !payslip}" data-bs-target="#payslipFalse" type="button"
                                    role="tab" aria-controls="payslipFalse" aria-selected="false">False</button>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="row  ">
                    <div class="col-auto d-flex align-items-center">
                        <p>ZeePay<br>
                            <small class="text-muted">Use Zeepay</small><br>
                        </p>
                    </div>
                    <div class="col d-flex justify-content-end align-content-center">
                        <ul class="nav nav-pills nav-justified tabs" id="zeepaytabs" role="tablist">
                            <li class="nav-item" role="presentation" (click)="zeepay=true;zeepayChange()">
                                <button class="nav-link" id="zeepay-true" data-bs-toggle="tab"
                                    [ngClass]="{'active': zeepay}" data-bs-target="#zeepayTrue" type="button" role="tab"
                                    aria-controls="zeepayTrue" aria-selected="true">True</button>
                            </li>
                            <li class="nav-item" role="presentation" (click)="zeepay=false;zeepayChange()">
                                <button class="nav-link" id="zeepay-false" data-bs-toggle="tab"
                                    [ngClass]="{'active': !zeepay}" data-bs-target="#zeepayFalse" type="button"
                                    role="tab" aria-controls="zeepayFalse" aria-selected="false">False</button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
