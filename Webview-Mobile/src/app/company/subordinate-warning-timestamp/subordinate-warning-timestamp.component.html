<div class="card shadow-sm mb-2">
  <div class="card-body">
    <div class="row">
      <div class="col-auto">
        <figure class="avatar avatar-70 rounded-10">
          <img appShowLoading *ngIf="employee.getPicture() ;else personblank" src="{{employee.getPicture()}}">
          <ng-template #personblank>
            <img src="assets/img/icon/person.png">
          </ng-template>
        </figure>
      </div>
      <div class="col px-0 align-self-center">
        <h3 class="mb-0 text-color-theme">{{employee.getFullname()}}</h3>
        <p class="text-muted ">{{employee.position.getName()}}</p>
      </div>
    </div>
  </div>
</div>

<div class="row mb-2">
  <div class="col-12 ">
    <div class="card ">
      <div class="card-header border-0">
        <!-- calendar -->
        <div class="row">
          <div class="col position-relative align-self-center">
            <h6 class="mb-1">{{"Date" | translate}}</h6>
            <input type="text" placeholder="Select date range" readonly="readonly" id="daterangetime"
              class="calendar-daterange text-muted small" daterangepicker [options]="options"
              (selected)="selectedDate($event, dateRange)" />

          </div>
          <div class="col-auto align-self-center">
            <button class="btn btn-light btn-44 daterange-btn"
              onclick="document.getElementById('daterangetime').click()">
              <i class="bi bi-calendar-range size-22"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<div *ngFor="let items of warningTimeFilter()">
  <div class="row mb-1 justify-content-center">
    <div class="col-12">
      <div class="card">
        <div class="card-body p-2">
          <div class="row mb-2">
            <div class="col-12 p-l-20">
              <p
                class="mb-0  text-color-theme">
                {{items.swipeDate | thaidate : "fullSpace"}}</p>
            </div>
          </div>
          <!-- <div class="card">
            <div class="card-body p-0"> -->
          <ul class="list-group list-group-flush bg-none">
            <li class="list-group-item " *ngFor="let item of items.items" >
              <div class="row">
                <div class="col-auto align-self-center">
                  <div class="avatar avatar-50 shadow rounded-10 bg-ligth">
                    <img appShowLoading *ngIf="item?.stampFileName != '' ;else personblank" src="{{item?.stampFileName}}">
                    <ng-template #personblank>
                      <img src="assets/img/icon/person.png">
                    </ng-template>
                  </div>
                </div>
                <div class="col align-self-center p-0">
                  <!-- <p class="text-color-theme mb-0 size-14 ">{{item.locationName}}</p> -->
                  <span
                    class="tag text-white py-1 px-2 {{item.timeStampStatus==1?'bg-warning border-warning':'bg-success border-success'}}">{{item.timeStampStatus==1?"Warning":"Complete"}}</span>
                </div>
                <div class="col-auto  align-self-center text-end p-0">
                  <p class="mb-0">{{item.swipeDateTime | date : 'HH:mm'}}</p>
                  <p class="text-muted size-12">{{(item.swipeTypeName =='In'?'In':'Out') | translate}}</p>
                </div>
                <div class="col-auto align-self-center ">
                  <button class="btn btn-primary btn-44 shadow-sm" (click)="goSubWarningTimeMap(item)">
                    <i class="bi bi-pencil-square"></i>
                  </button>
                </div>
              </div>
            </li>
          </ul>
        </div>
        <!-- </div>
        </div> -->
      </div>
    </div>
  </div>
</div>
