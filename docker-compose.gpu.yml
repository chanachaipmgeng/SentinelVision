# Enable NVIDIA GPU for API. Requires NVIDIA driver + Container Toolkit.
# Dual-GPU layout: api → physical GPU0, api-gpu1 → physical GPU1.
# Each process sees a single device as cuda:0 (via CUDA_VISIBLE_DEVICES).
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  api:
    environment:
      FACE_DEVICE: "cuda:0"
      FACE_DEVICES: "cuda:0"
      # Oversubscribe a bit: ONNX releases the GIL during inference.
      FACE_GPU_WORKERS: "${FACE_GPU_WORKERS:-3}"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Second API process pinned to GPU1 — spreads GIL/decode/WS across 2 cores.
  api-gpu1:
    build:
      context: ./API-Fast
      dockerfile: Dockerfile
    container_name: dpu-api-gpu1
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dpu}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (no default)}@db:5432/${POSTGRES_DB:-dpu}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-20}
      RATE_LIMIT_IDENTIFY_PER_MINUTE: ${RATE_LIMIT_IDENTIFY_PER_MINUTE:-120}
      RATE_LIMIT_IMPORT_PER_MINUTE: ${RATE_LIMIT_IMPORT_PER_MINUTE:-10}
      FACE_PAD_MODEL_PATH: ${FACE_PAD_MODEL_PATH:-}
      FACE_MODEL_VERSION: ${FACE_MODEL_VERSION:-buffalo_l}
      APP_ENV: ${APP_ENV:-production}
      FACE_RECOGNITION_THRESHOLD: ${FACE_RECOGNITION_THRESHOLD:-0.40}
      CHECK_IN_DEDUPE_SECONDS: ${CHECK_IN_DEDUPE_SECONDS:-300}
      IMAGE_BLUR_THRESHOLD: ${IMAGE_BLUR_THRESHOLD:-20.0}
      IMAGE_BLUR_THRESHOLD_IMPORT: ${IMAGE_BLUR_THRESHOLD_IMPORT:-0}
      IMAGE_BRIGHTNESS_MIN: ${IMAGE_BRIGHTNESS_MIN:-40}
      IMAGE_BRIGHTNESS_MAX: ${IMAGE_BRIGHTNESS_MAX:-220}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env (random, >= 32 chars)}
      AUTH_FAIL_FAST: ${AUTH_FAIL_FAST:-true}
      # Only `api` may run MIGRATE_ON_STARTUP; the second process just verifies the schema.
      REQUIRE_SCHEMA_HEAD: ${REQUIRE_SCHEMA_HEAD:-true}
      # OIDC SSO relying party (Authorization Code + PKCE). Empty = disabled.
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
      FACE_DEVICE: "cuda:0"
      FACE_DEVICES: "cuda:0"
      FACE_GPU_WORKERS: "${FACE_GPU_WORKERS:-3}"
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-false}
      CUDA_VISIBLE_DEVICES: "1"
      NVIDIA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # B7: import uploads land on the shared volume for the worker (nginx may route here).
      RUN_BACKGROUND_JOBS_IN_API: ${RUN_BACKGROUND_JOBS_IN_API:-false}
      IMPORT_JOB_DIR: /app/import_jobs
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Phase 4B clips (must match api service in docker-compose.yml)
      MEDIAMTX_ENABLED: ${MEDIAMTX_ENABLED:-true}
      MEDIAMTX_API_URL: ${MEDIAMTX_API_URL:-http://mediamtx:9997}
      MEDIAMTX_RTSP_PUBLISH_URL: ${MEDIAMTX_RTSP_PUBLISH_URL:-rtsp://mediamtx:8554}
      MEDIAMTX_RECORDINGS_DIR: ${MEDIAMTX_RECORDINGS_DIR:-/recordings}
      MEDIAMTX_HLS_INTERNAL_URL: ${MEDIAMTX_HLS_INTERNAL_URL:-http://mediamtx:8888}
      VIDEO_CLIP_PRE_SECONDS: ${VIDEO_CLIP_PRE_SECONDS:-5}
      VIDEO_CLIP_POST_SECONDS: ${VIDEO_CLIP_POST_SECONDS:-10}
      VIDEO_CLIP_RETENTION_DAYS: ${VIDEO_CLIP_RETENTION_DAYS:-30}
    volumes:
      - api_enrolled:/app/enrolled_images
      - api_uploaded:/app/uploaded_images
      - api_temp:/app/temp_images
      - api_import_jobs:/app/import_jobs
      - api_video_clips:/app/video_clips
      - mediamtx_recordings:/recordings:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    gpus: all
    deploy:
      resources:
        # Same caps as `api` in docker-compose.prod.yml (prod overlay cannot target this
        # service without also defining it, so the limits live here).
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  nginx:
    volumes:
      - ./docker/nginx/default.dual-gpu.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      api-gpu1:
        condition: service_healthy
      admin:
        condition: service_started
