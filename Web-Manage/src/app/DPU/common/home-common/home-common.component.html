<app-page-header [title]="'หน้าหลัก'" [activeTitle]="'ระบบ'" [title1]="'หน้าหลัก'"></app-page-header>

<div class="grid grid-cols-12 gap-x-6">
  <div class="xl:col-span-4 lg:col-span-6 col-span-12">
    <div class="box dpu-stat-card modern-card animate-in zoom-in duration-500 delay-100">
      <div class="box-body">
        <div class="flex items-center justify-between">
          <div>
            <p class="dpu-stat-card__label">จัดการระบบ</p>
            <p class="dpu-stat-card__value">Admin</p>
          </div>
          <div class="bg-primary/10 text-primary p-3 rounded-full">
            <i class="ri-settings-4-line text-2xl"></i>
          </div>
        </div>
        <p class="text-dpu-muted text-[0.85rem] mt-2">ศูนย์กลางจัดการผู้ใช้ บริษัท และพนักงาน</p>
      </div>
    </div>
  </div>

  <div class="xl:col-span-4 lg:col-span-6 col-span-12">
    <div class="box dpu-stat-card modern-card animate-in zoom-in duration-500 delay-200">
      <div class="box-body">
        <div class="flex items-center justify-between">
          <div>
            <p class="dpu-stat-card__label">บริษัท</p>
            <p class="dpu-stat-card__value">Company</p>
          </div>
          <div class="bg-secondary/10 text-secondary p-3 rounded-full">
            <i class="ri-building-2-line text-2xl"></i>
          </div>
        </div>
        <p class="text-dpu-muted text-[0.85rem] mt-2">ตั้งค่าบริษัท ลงเวลา และใบหน้า</p>
      </div>
    </div>
  </div>

  <div class="xl:col-span-4 lg:col-span-12 col-span-12">
    <div class="box dpu-stat-card modern-card animate-in zoom-in duration-500 delay-300">
      <div class="box-body">
        <div class="flex items-center justify-between">
          <div>
            <p class="dpu-stat-card__label">ความปลอดภัย</p>
            <p class="dpu-stat-card__value">Secure</p>
          </div>
          <div class="bg-success/10 text-success p-3 rounded-full">
            <i class="ri-shield-check-line text-2xl"></i>
          </div>
        </div>
        <p class="text-dpu-muted text-[0.85rem] mt-2">ระบบลงเวลาด้วยใบหน้าและตำแหน่ง</p>
      </div>
    </div>
  </div>

  <div class="col-span-12">
    <div class="box modern-card glass animate-in slide-in-from-bottom-8 duration-700 delay-400">
      <div class="box-header">
        <h5 class="box-title flex items-center gap-2"><i class="ri-flashlight-line text-warning"></i> เมนูด่วน</h5>
      </div>
      <div class="box-body">
        <div class="grid grid-cols-12 gap-4">
          <div class="xl:col-span-4 md:col-span-6 col-span-12">
            <a routerLink="/admin/member-manage" class="dpu-quick-link flex items-center p-4 border border-defaultborder dark:border-white/10 rounded-xl transition-all duration-300 hover:scale-105 hover:border-primary hover:text-primary hover:shadow-md hover:bg-primary/5">
              <i class="ri-team-line text-2xl me-3"></i>
              <span class="font-semibold text-lg">จัดการสมาชิก</span>
            </a>
          </div>
          <div class="xl:col-span-4 md:col-span-6 col-span-12">
            <a routerLink="/admin/manage-companys" class="dpu-quick-link flex items-center p-4 border border-defaultborder dark:border-white/10 rounded-xl transition-all duration-300 hover:scale-105 hover:border-secondary hover:text-secondary hover:shadow-md hover:bg-secondary/5">
              <i class="ri-building-line text-2xl me-3"></i>
              <span class="font-semibold text-lg">จัดการบริษัท</span>
            </a>
          </div>
          <div class="xl:col-span-4 md:col-span-6 col-span-12">
            <a routerLink="/admin/admin-manage" class="dpu-quick-link flex items-center p-4 border border-defaultborder dark:border-white/10 rounded-xl transition-all duration-300 hover:scale-105 hover:border-success hover:text-success hover:shadow-md hover:bg-success/5">
              <i class="ri-shield-user-line text-2xl me-3"></i>
              <span class="font-semibold text-lg">ผู้ดูแลระบบ</span>
            </a>
          </div>
          <div class="xl:col-span-4 md:col-span-6 col-span-12">
            <a routerLink="/admin/emp/department" class="dpu-quick-link flex items-center p-4 border border-defaultborder dark:border-white/10 rounded-xl transition-all duration-300 hover:scale-105 hover:border-info hover:text-info hover:shadow-md hover:bg-info/5">
              <i class="ri-organization-chart text-2xl me-3"></i>
              <span class="font-semibold text-lg">แผนก</span>
            </a>
          </div>
          <div class="xl:col-span-4 md:col-span-6 col-span-12">
            <a routerLink="/admin/emp/position" class="dpu-quick-link flex items-center p-4 border border-defaultborder dark:border-white/10 rounded-xl transition-all duration-300 hover:scale-105 hover:border-warning hover:text-warning hover:shadow-md hover:bg-warning/5">
              <i class="ri-briefcase-line text-2xl me-3"></i>
              <span class="font-semibold text-lg">ตำแหน่ง</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
