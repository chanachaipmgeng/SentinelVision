<div class="card shadow-sm mb-4">
    <div class="card-body">
        <div class="row">
            <div class="col-auto">
                <figure class="avatar avatar-60 rounded-10">
                    <img *ngIf="pictureUrl != '' ;else personblank" src="{{pictureUrl}}">
                    <ng-template #personblank>
                        <img src="assets/img/icon/person.png">
                    </ng-template>
                </figure>
            </div>
            <div class="col px-0 align-self-center">
                <h3 class="mb-0 text-color-theme">{{fullName}}</h3>
                <p class="text-muted ">{{companyName}}</p>
            </div>
        </div>
    </div>
</div>

<div class="card shadow-sm mb-4">
    <!-- <div class="card-body text-center ">
      <p class="text-muted">ข้อมูลทีมงาน</p>
    </div> -->
    <ul class="list-group list-group-flush bg-none">

                    class="float-end bi bi-chevron-right"></i></a></li>
    </ul>
</div>
