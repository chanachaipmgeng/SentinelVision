# http-context settings shared by every gateway variant (default / dual / quad / hexa).
# Loaded from /etc/nginx/conf.d/ before default.conf.

server_tokens off;

# Default request body cap for the whole gateway. Face / profile uploads are ≤ 8 MB
# (API UPLOAD_MAX_BYTES); only the employee Excel + photo-ZIP import may go to 500m
# (raised per-location in snippets/gateway.conf). Kiosk frames travel over WebSocket.
client_max_body_size 32m;

# Preserve HTTPS when TLS terminates in front of this container (host edge or the
# docker-compose.tls.yml listener on 8443, which proxies to this server on 8080).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# HTTP → HTTPS redirect decision, only acted on when docker-compose.tls.yml is active
# (snippet https-redirect.conf is generated by entrypoint/30-dpu-runtime.sh).
# Loopback health probes stay on plain HTTP so the container healthcheck keeps working.
map "$forwarded_proto:$uri" $dpu_https_redirect {
    default         1;
    "~^https:"      0;
    "~^http:/health$" 0;
}

# Kiosk WebSocket connection cap per client IP (A3 hardening).
# Default 16 matches WS_KIOSK_MAX_CONN_PER_IP in the API; raise both for load tests
# or many kiosks behind one NAT. Excess handshakes get HTTP 429 (no upstream, no GPU).
limit_conn_zone $binary_remote_addr zone=kiosk_ws_per_ip:10m;
limit_conn_log_level warn;

# Request rate limits (B4 hardening). Keys are the client IP after real_ip recovery, so
# behind the host TLS edge they are per kiosk / per browser, not per edge.
#   dpu_login    POST /auth/login             — brute-force protection (API also locks accounts)
#   dpu_refresh  /auth/refresh*, /auth/kiosk/refresh
#   dpu_pair     POST /auth/kiosk/pair        — one-time pairing codes (API: KIOSK_PAIR_MAX_ATTEMPTS_PER_MINUTE)
#   dpu_api      everything else proxied to FastAPI (not the kiosk WebSocket)
# Bursts are applied per location in snippets/gateway.conf. Excess → 429.
limit_req_zone $binary_remote_addr zone=dpu_login:10m   rate=20r/m;
limit_req_zone $binary_remote_addr zone=dpu_refresh:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=dpu_pair:10m    rate=10r/m;
# D7: complement app rate limits for identify + employee import.
limit_req_zone $binary_remote_addr zone=dpu_identify:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=dpu_import:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=dpu_api:20m     rate=100r/s;
limit_req_log_level warn;
limit_req_status 429;
