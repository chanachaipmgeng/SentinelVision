# Hexa-API gateway: least_conn across 3 processes per GPU (6 total).
#   api + api-gpu0b + api-gpu0c → GPU0
#   api-gpu1 + api-gpu1b + api-gpu1c → GPU1
# Mounted by docker-compose.gpu-x3.yml.
# Routing, rate limits, internal-only endpoints and security headers come from
# snippets/gateway.conf (baked into the image — rebuild nginx when snippets change).

upstream dpu_api {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=20s;
    server api-gpu1:8000 max_fails=3 fail_timeout=20s;
    server api-gpu0b:8000 max_fails=3 fail_timeout=20s;
    server api-gpu1b:8000 max_fails=3 fail_timeout=20s;
    server api-gpu0c:8000 max_fails=3 fail_timeout=20s;
    server api-gpu1c:8000 max_fails=3 fail_timeout=20s;
}

server {
    set $dpu_api http://dpu_api;
    include /etc/nginx/snippets/gateway.conf;
}
