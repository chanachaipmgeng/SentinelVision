# Shared Trivy settings for CI (`trivy fs --config trivy.yaml .` and `trivy image --config trivy.yaml <ref>`)
# and for local runs. Allow-listed findings live in .trivyignore.yaml (with justification + expiry).
severity:
  - HIGH
  - CRITICAL
exit-code: 1
ignorefile: .trivyignore.yaml
vulnerability:
  # Findings without an upstream fix cannot be acted on; they are reviewed via `trivy fs` without
  # this flag during the quarterly dependency review instead of blocking every PR.
  ignore-unfixed: true
scan:
  skip-dirs:
    - Web-Manage/node_modules
    - Web-Manage/dist
    - Web-Manage/.angular
    - API-Fast/enrolled_images
    - API-Fast/uploaded_images
    - API-Fast/temp_images
    # Face detection model protos (60 MB text) — nothing to scan, slows the secret scanner down.
    - Web-Manage/src/assets/models
  skip-files:
    # Vendored icon-font package shipped as a static asset; its dev lockfile is never installed.
    - Web-Manage/src/assets/iconfonts/boxicons/package-lock.json
