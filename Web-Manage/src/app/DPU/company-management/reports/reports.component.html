<app-page-header [title]="'รายงาน'" [activeTitle]="'ลงเวลา'" [title1]="'Reports'"></app-page-header>

<div class="dpu-list-page grid grid-cols-12 gap-x-6 gap-y-4">
  <div class="col-span-12">
    <app-page-toolbar title="รายงานการลงเวลา">
      <ng-container controls>
        <button type="button" class="ti-btn ti-btn-primary-full modern-btn" [disabled]="busy" (click)="export()">
          <i class="ri-download-2-line"></i>
          ส่งออก
        </button>
      </ng-container>
    </app-page-toolbar>
    <p class="text-sm text-dpu-muted mb-3">สรุปรายเดือน / รายคน — ดาวน์โหลด Excel หรือ CSV (ดิบหรือ payroll)</p>
  </div>

  <div class="col-span-12 lg:col-span-6">
    <div class="box modern-card glass">
      <div class="box-header"><div class="box-title">ตัวกรอง</div></div>
      <div class="box-body space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">ตั้งแต่</label>
            <input type="date" class="form-control" [(ngModel)]="draft.startDate" />
          </div>
          <div>
            <label class="form-label">ถึง</label>
            <input type="date" class="form-control" [(ngModel)]="draft.endDate" />
          </div>
        </div>
        <div>
          <label class="form-label">พนักงาน (ว่าง = ทั้งบริษัท)</label>
          <select class="form-control" [(ngModel)]="draft.company_employeeId">
            <option value="">— ทั้งหมด —</option>
            <option *ngFor="let e of employees" [value]="e.company_employeeId">{{ e.label }}</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">โหมด</label>
            <select class="form-control" [(ngModel)]="draft.mode">
              <option value="raw">รายการดิบ</option>
              <option value="payroll">Payroll summary</option>
            </select>
          </div>
          <div>
            <label class="form-label">รูปแบบ</label>
            <select class="form-control" [(ngModel)]="draft.format">
              <option value="xlsx">Excel (.xlsx)</option>
              <option value="csv">CSV</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
