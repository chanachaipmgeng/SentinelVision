<div class="row bg-primary" *ngIf="!landingCheck">
  <div class="col-12">
    <div class="card shadow-sm my-2">
      <div class="card-body">
        <div *ngIf="pdpaModel">
          <div [innerHtml]="lang == 'th' ? pdpaModel.requestConsent : pdpaModel.requestConsentEng"> </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row  bg-primary" *ngIf="!landingCheck">
  <div class="col-12">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="row ">
          <div class="col-12 mb-2 d-flex justify-content-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="checkPdPa" id="checkPdPa" [(ngModel)]="checkBoxPdPa">
                <label class="form-check-label" for="checkPdPa">{{ "Accept terms and conditions" | translate}} </label>
              </div>
          </div>
          <div class="col-12">
            <button type="button" class="col-12 btn btn-primary rounded-15 btn-model" [disabled]="!checkBoxPdPa" (click)="onSubmit()">
              {{"BUTTON.SUBMIT" | translate}}
          </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
