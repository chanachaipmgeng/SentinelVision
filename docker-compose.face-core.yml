# DPU API linked to sibling Face Core (shared Docker network `face-net`).
#
# One-time: docker network create face-net
# Sibling checkout must exist at ../face-core (or /opt/face-core next to this repo).
# FACE_CORE_API_KEY must be set in .env — there is no placeholder default.
services:
  api:
    build:
      context: ./API-Fast
      dockerfile: Dockerfile.bff
      additional_contexts:
        face_sdk: ../face-core/sdk/python
    environment:
      FACE_CORE_ENABLED: "true"
      FACE_CORE_URL: http://face-core-api:8000
      FACE_CORE_API_KEY: ${FACE_CORE_API_KEY:?set FACE_CORE_API_KEY in .env}
      FACE_DEVICE: cpu
      NVIDIA_VISIBLE_DEVICES: ""
      PYTHONPATH: /opt/face-core-sdk
    networks:
      - default
      - face-net

networks:
  face-net:
    external: true
    name: face-net
