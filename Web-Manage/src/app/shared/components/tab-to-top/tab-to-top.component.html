    <!-- Back To Top -->
    <button
      type="button"
      class="scrollToTop"
      aria-label="Back to top"
      (click)="taptotop()"
      [ngStyle]="{ display: show ? 'flex' : 'none' }">
        <span class="arrow" aria-hidden="true"><i class="ri-arrow-up-s-fill text-xl leading-loose"></i></span>
    </button>
