# Shared server body for every gateway variant. The including file must define
#   set $dpu_api http://api:8000;      (default.conf — Docker DNS, re-resolved via resolver)
#   set $dpu_api http://dpu_api;       (dual / quad / hexa — upstream group with least_conn)
# before this include. Generated snippets under /tmp/dpu-nginx/ come from
# entrypoint/30-dpu-runtime.sh (EXPOSE_API_DOCS, INTERNAL_ALLOW_CIDRS, TLS_*, CSP_*).

# Behind a host TLS edge (tls-edge.example.conf) or the docker-compose.tls.yml listener,
# every socket arrives from loopback / the docker bridge; recover the real client so
# limit_req / limit_conn and the API's per-IP cap are per kiosk, not per edge.
# Only private ranges are trusted.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

listen 8080;
server_name _;
set $dpu_admin http://admin:8080;

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# HTTP → HTTPS (only when TLS is enabled; the generated file is empty otherwise).
include /tmp/dpu-nginx/https-redirect.conf;

# --- Face kiosk WebSocket (must precede general /face regex) ---
location ^~ /face/ws/ {
    limit_conn kiosk_ws_per_ip 16;
    limit_conn_status 429;
    proxy_pass $dpu_api;
    include /etc/nginx/snippets/proxy-common.conf;
    include /tmp/dpu-nginx/headers-api.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- Auth endpoints with tight per-IP rate limits ---
# POST = API login (rate limited). A browser GET (deep link / refresh of the Angular login
# page) is served the SPA document instead of FastAPI's 405 (`if` + `return` only — safe).
location = /auth/login {
    error_page 418 = @spa_document;
    if ($request_method = GET) { return 418; }
    limit_req zone=dpu_login burst=10 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# D6 /api/v1 alias of login — same tight limit as /auth/login.
location = /api/v1/auth/login {
    limit_req zone=dpu_login burst=10 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /auth/change-password {
    error_page 418 = @spa_document;
    if ($request_method = GET) { return 418; }
    limit_req zone=dpu_api burst=200 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Angular-only routes under /auth/ (no API counterpart).
location = /auth/reset-password {
    limit_req zone=dpu_api burst=200 nodelay;
    proxy_pass $dpu_admin;
    include /etc/nginx/snippets/proxy-common.conf;
    include /tmp/dpu-nginx/headers-spa.conf;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '__CSP_NONCE__' $request_id;
}

location = /auth/kiosk/pair {
    limit_req zone=dpu_pair burst=5 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location ~ ^/auth/(refresh|refresh-token|kiosk/refresh)$ {
    limit_req zone=dpu_refresh burst=20 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# OIDC SSO redirect target is an Angular route: exact match beats the /auth API regex below.
location = /auth/sso/callback {
    limit_req zone=dpu_api burst=200 nodelay;
    proxy_pass $dpu_admin;
    include /etc/nginx/snippets/proxy-common.conf;
    include /tmp/dpu-nginx/headers-spa.conf;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '__CSP_NONCE__' $request_id;
}

# Excel + optional face-photo ZIP (must precede the general API regex)
location ~ ^/(api/v1/)?employees/.+/import(-jobs)?$ {
    limit_req zone=dpu_import burst=5 nodelay;
    client_max_body_size 500m;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# D7 identify — tighter than general API (app also enforces RATE_LIMIT_IDENTIFY_PER_MINUTE).
location ~ ^/(api/v1/)?face/members/identify$ {
    limit_req zone=dpu_identify burst=40 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# --- Internal-only endpoints: Prometheus scrape + OpenAPI docs ---
# INTERNAL_ALLOW_CIDRS (default RFC1918 + loopback) gates both; /docs additionally needs
# EXPOSE_API_DOCS=true on nginx *and* on the API (FastAPI mounts /docs only when enabled).
location = /metrics {
    include /tmp/dpu-nginx/internal-allow.conf;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location ~ ^/(docs|redoc|openapi\.json)(/|$) {
    include /tmp/dpu-nginx/internal-allow.conf;
    include /tmp/dpu-nginx/api-docs.conf;
}

# --- FastAPI (same-origin for Angular baseUrl='') ---
location ~ ^/(auth|members|companys|companies|company-locations|departments|positions|employees|timestamp|face|api|system|dashboard|images|enrolled_images|notifications|hr|sentinel|health|ready)(/|$) {
    limit_req zone=dpu_api burst=200 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Former employee mobile app — removed; send clients to admin.
location = /mobile {
    return 301 /;
}

location /mobile/ {
    return 301 /;
}

# --- Admin SPA (default) ---
# One Angular document serves login, admin pages, the kiosk (/company/timestamp-face),
# /kiosk/pair and the face-enrollment dialog, and in-app navigation is pushState (no new
# document). Permissions-Policy is therefore set per document, not per route: camera and
# geolocation are allowed for the SPA origin itself (headers-spa.conf) and denied everywhere
# else (headers-api.conf). The CSP nonce ($request_id) is injected into index.html via
# sub_filter; Angular reads it from ngCspNonce and the Maps loader from the inline script.
location / {
    limit_req zone=dpu_api burst=200 nodelay;
    proxy_pass $dpu_admin;
    include /etc/nginx/snippets/proxy-common.conf;
    include /tmp/dpu-nginx/headers-spa.conf;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '__CSP_NONCE__' $request_id;
}

# Target of the 405→SPA rewrite above (same document as location /).
location @spa_document {
    proxy_pass $dpu_admin;
    include /etc/nginx/snippets/proxy-common.conf;
    include /tmp/dpu-nginx/headers-spa.conf;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '__CSP_NONCE__' $request_id;
}
