<div class="dpu-auth">
  <div class="dpu-auth__panel">
    <div class="dpu-auth__brand">
      <img src="./assets/images/brand-logos/logo.png" alt="DPU Time Attendance">
      <h1 class="dpu-auth__title">Time Attendance</h1>
      <p class="dpu-auth__subtitle">เข้าสู่ระบบจัดการหลังบ้าน</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      @if (errorMessage.length > 0) {
        <p class="dpu-auth__error">{{ errorMessage }}</p>
      }
      @if (_error.message.length > 0) {
        <p class="dpu-auth__error">{{ _error.message }}</p>
      }
      @if (error) {
        <p class="dpu-auth__error">{{ error }}</p>
      }

      <div class="grid grid-cols-12 gap-y-4">
        <div class="col-span-12">
          <label for="signin-username" class="form-label">ชื่อผู้ใช้</label>
          <input
            type="text"
            class="form-control form-control-lg w-full"
            id="signin-username"
            placeholder="Username"
            formControlName="username"
            autocomplete="username">
        </div>
        <div class="col-span-12">
          <label for="signin-password" class="form-label">รหัสผ่าน</label>
          <div class="input-group">
            <input
              class="form-control form-control-lg !rounded-s-md"
              id="signin-password"
              placeholder="Password"
              formControlName="password"
              autocomplete="current-password"
              [type]="showPassword ? 'text' : 'password'">
            <button
              aria-label="แสดงรหัสผ่าน"
              class="ti-btn ti-btn-light !rounded-s-none !mb-0"
              type="button"
              (click)="toggleVisibility()">
              <i class="ri-eye-{{ toggleClass }} align-middle"></i>
            </button>
          </div>
        </div>
        <div class="col-span-12">
          <button
            type="submit"
            class="ti-btn ti-btn-primary dpu-auth__submit"
            [disabled]="!loginForm.valid || showLoader"
            [class.loader--text]="showLoader">
            เข้าสู่ระบบ
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
