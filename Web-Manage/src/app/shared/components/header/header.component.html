<!-- Start::Header -->
<header class="app-header">
  <nav class="main-header !h-[3.75rem]" aria-label="Global">
    <div class="main-header-container ps-[0.725rem] pe-[1rem]">
      <div class="header-content-left">
        <div class="header-element">
          <div class="horizontal-logo">
            <a routerLink="/admin/home" class="header-logo" aria-label="DPU Home">
              <img src="./assets/images/brand-logos/desktop-logo.png" alt="logo" class="desktop-logo">
              <img src="./assets/images/brand-logos/toggle-logo.png" alt="logo" class="toggle-logo">
              <img src="./assets/images/brand-logos/desktop-dark.png" alt="logo" class="desktop-dark">
              <img src="./assets/images/brand-logos/toggle-dark.png" alt="logo" class="toggle-dark">
              <img src="./assets/images/brand-logos/desktop-white.png" alt="logo" class="desktop-white">
              <img src="./assets/images/brand-logos/toggle-white.png" alt="logo" class="toggle-white">
            </a>
          </div>
        </div>
        <div class="header-element md:px-[0.325rem] !items-center">
          <a aria-label="Hide Sidebar"
            class="sidemenu-toggle animated-arrow hor-toggle horizontal-navtoggle inline-flex items-center"
            href="javascript:void(0);" (click)="toggleSidebar()"><span></span></a>
        </div>
      </div>

      <div class="header-content-right">
        <!-- Language -->
        <div
          class="header-element py-[1rem] md:px-[0.5rem] px-2 header-country hs-dropdown ti-dropdown hidden sm:block [--placement:bottom-left]">
          <button id="dropdown-flag" type="button"
            class="hs-dropdown-toggle ti-dropdown-toggle !p-0 flex-shrink-0 !border-0 !rounded-full !shadow-none"
            aria-label="เปลี่ยนภาษา">
            <img src="./assets/images/flags/{{selectedLanguage}}.png" alt=""
              class="h-[1.25rem] w-[1.25rem] rounded-full">
          </button>
          <div class="hs-dropdown-menu ti-dropdown-menu min-w-[10rem] hidden !-mt-3" aria-labelledby="dropdown-flag">
            <div class="ti-dropdown-divider divide-y divide-gray-200 dark:divide-white/10">
              <div class="py-2 first:pt-0 last:pb-0">
                <div class="ti-dropdown-item !p-[0.65rem]" (click)="changeLanguage('en')">
                  <div class="flex items-center space-x-2 rtl:space-x-reverse w-full">
                    <img src="./assets/images/flags/en.png" alt="" class="h-[1rem] w-[1rem] rounded-full">
                    <p class="!text-[0.8125rem] font-medium mb-0">English</p>
                  </div>
                </div>
                <div class="ti-dropdown-item !p-[0.65rem]" (click)="changeLanguage('th')">
                  <div class="flex items-center space-x-2 rtl:space-x-reverse w-full">
                    <img src="./assets/images/flags/th.png" alt="" class="h-[1rem] w-[1rem] rounded-full">
                    <p class="!text-[0.8125rem] font-medium mb-0">ไทย</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Theme toggle kept for Ynex attrs; hidden via .dpu-theme-lock -->
        <div class="header-element header-theme-mode hidden !items-center sm:block !py-[1rem] md:!px-[0.5rem] px-2">
          <a aria-label="Dark mode"
            class="hs-dark-mode-active:hidden flex hs-dark-mode group flex-shrink-0 justify-center items-center gap-2 rounded-full font-medium transition-all text-xs"
            href="javascript:void(0);" data-hs-theme-click-value="dark"
            (click)="themeChange('dark', 'dark','dark')">
            <i class="bx bx-moon header-link-icon"></i>
          </a>
          <a aria-label="Light mode"
            class="hs-dark-mode-active:flex hidden hs-dark-mode group flex-shrink-0 justify-center items-center gap-2 rounded-full font-medium transition-all text-xs"
            href="javascript:void(0);" data-hs-theme-click-value="light"
            (click)="themeChange('light', 'light','dark')">
            <i class="bx bx-sun header-link-icon"></i>
          </a>
        </div>

        <!-- Admin quick link -->
        <div *ngIf="adminRole"
          class="header-element header-apps py-[1rem] md:px-[0.5rem] px-2 hs-dropdown ti-dropdown md:!block !hidden [--placement:bottom-left]">
          <button aria-label="สิทธิ์การใช้งาน" id="dropdown-apps" type="button"
            class="hs-dropdown-toggle ti-dropdown-toggle !p-0 !border-0 flex-shrink-0 !rounded-full !shadow-none text-xs">
            <i class="bx bx-grid-alt header-link-icon text-[1.125rem]"></i>
          </button>
          <div class="p-3 main-header-dropdown !-mt-3 hs-dropdown-menu ti-dropdown-menu !w-[14rem] border-0 hidden"
            aria-labelledby="dropdown-apps">
            <p class="mb-2 px-1 text-[0.8rem] font-semibold text-defaulttextcolor">สิทธิ์การใช้งาน</p>
            <a routerLink="/admin/home"
              class="dpu-header-app-link flex items-center gap-2 rounded-lg px-3 py-2.5 hover:bg-primary/5">
              <span class="dpu-header-app-icon"><i class="ri-shield-user-line"></i></span>
              <span class="text-[0.82rem] font-semibold">ผู้ดูแลระบบ</span>
            </a>
          </div>
        </div>

        <!-- Fullscreen -->
        <div class="header-element header-fullscreen py-[1rem] md:px-[0.5rem] px-2">
          <a aria-label="Fullscreen" appFullscreen (click)="toggleFullScreen()"
            class="inline-flex flex-shrink-0 justify-center items-center gap-2 !rounded-full">
            <i class="bx bx-fullscreen full-screen-open header-link-icon" [hidden]="!fullScreenIconVisible"></i>
            <i class="bx bx-exit-fullscreen full-screen-close header-link-icon"
              [hidden]="!exitFullScreenIconVisible"></i>
          </a>
        </div>

        <!-- Profile -->
        <div class="header-element md:!px-[0.5rem] px-2 hs-dropdown !items-center ti-dropdown [--placement:bottom-left]">
          <button id="dropdown-profile" type="button"
            class="hs-dropdown-toggle ti-dropdown-toggle !gap-2 !p-0 flex-shrink-0 sm:me-2 me-0 !rounded-full !shadow-none text-xs align-middle !border-0">
            <img class="inline-block rounded-full" [src]="userModel.getPicture()" width="32" height="32" alt="">
          </button>
          <div class="md:block hidden dropdown-profile">
            <p class="font-semibold mb-0 leading-none text-[#536485] text-[0.813rem]">
              {{ userModel.firstName + ' ' + userModel.lastName }}
            </p>
            <span class="opacity-[0.7] font-normal text-[#536485] block text-[0.6875rem]">{{ userModel.getRole() }}</span>
          </div>
          <div
            class="hs-dropdown-menu ti-dropdown-menu !-mt-3 border-0 w-[11rem] !p-0 hidden main-header-dropdown pt-0 overflow-hidden header-profile-dropdown dropdown-menu-end"
            aria-labelledby="dropdown-profile">
            <ul class="text-defaulttextcolor font-medium">
              <li>
                <a class="w-full ti-dropdown-item !text-[0.8125rem] !p-[0.65rem] !gap-x-0 !inline-flex"
                  (click)="logOut()">
                  <i class="ti ti-logout text-[1.125rem] me-2 opacity-[0.7]"></i>Log Out
                </a>
              </li>
            </ul>
          </div>
        </div>

        <!-- Switcher kept for Ynex mount; hidden via .dpu-theme-lock -->
        <div class="header-element md:px-[0.48rem]">
          <button aria-label="Theme switcher" type="button"
            class="hs-dropdown-toggle switcher-icon inline-flex flex-shrink-0 justify-center items-center gap-2 rounded-full font-medium align-middle transition-all text-xs"
            data-hs-overlay="#hs-overlay-switcher">
            <i class="bx bx-cog header-link-icon animate-spin-slow"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>
</header>
<!-- End::Header -->
