    <div class="col-10 col-md-6 col-lg-5 col-xl-3 mx-auto align-self-center text-center py-4">
        <h1 class="mb-4 text-color-theme">Reset Password</h1>

        <div class="form-group form-floating is-valid mb-3" [ngClass]="{'is-valid': oldPassword,'is-invalid':!oldPassword}">
            <input [type]="showOldPassWord ? 'text' : 'password'" class="form-control" id="oldpassword" placeholder="Old Password"
                [(ngModel)]="oldPassword" (ngModelChange)="checkOPeror=false">
            <label class="form-control-label" for="oldpass">Old Password</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="Enter valid Password" id="oldpass" *ngIf="!oldPassword">
                <i class="bi bi-info-circle"></i>
            </button>
            <button type="button" class="btn btn-link text-default tooltip-btn" data-bs-toggle="tooltip" (click)="showPassWord('old')"
                data-bs-placement="left" title="Show Password" id="showOldpass" *ngIf="oldPassword">
                <!-- <i class="bi bi-eye"></i> -->
                <i class="bi" [ngClass]="showOldPassWord ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
        </div>
        <p class="mb-3 text-center text-danger" *ngIf="checkOPeror">
            {{"Oldpassword is incorrect"}}
        </p>

        <div class="form-group form-floating is-valid mb-3"
            [ngClass]="{'is-valid': newPassword,'is-invalid':!newPassword}">
            <input [type]="showNewPassWord ? 'text' : 'password'" class="form-control" id="newpass" placeholder="New Password"
                [(ngModel)]="newPassword" (ngModelChange)="checkOPeror=false">
            <label class="form-control-label" for="newpass">New Password</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="Enter valid Password" id="newpass" *ngIf="!newPassword">
                <i class="bi bi-info-circle"></i>
            </button>
            <button type="button" class="btn btn-link text-default tooltip-btn" data-bs-toggle="tooltip" (click)="showPassWord('new')"
                data-bs-placement="left" title="Show Password" id="oldpass" *ngIf="newPassword">
                <!-- <i class="bi bi-eye"></i> -->
                <i class="bi" [ngClass]="showNewPassWord ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
        </div>

        <div class="form-group form-floating is-invalid mb-3"
            [ngClass]="{'is-valid': confirmNewPassword,'is-invalid':!confirmNewPassword || confirmNewPassword != newPassword}">
            <input [type]="showConfirmPass ? 'text' : 'password'" class="form-control " id="password" placeholder="Confirm New Password"
                [(ngModel)]="confirmNewPassword" (ngModelChange)="checkOPeror=false">
            <label class="form-control-label" for="password">Confirm New Password</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="Enter valid Password" id="passworderror" *ngIf="!confirmNewPassword">
                <i class="bi bi-info-circle"></i>
            </button>
            <button type="button" class="btn btn-link text-default tooltip-btn" data-bs-toggle="tooltip" (click)="showPassWord('confirm')"
                data-bs-placement="left" title="Show Password" id="oldpass" *ngIf="confirmNewPassword">
                <!-- <i class="bi bi-eye"></i> -->
                <i class="bi" [ngClass]="showConfirmPass ? 'bi-eye-slash' : 'bi-eye'"></i>

            </button>
        </div>

        <!-- <a routerLink="/thankyou" target="_self" class="btn btn-lg btn-default w-100 shadow">เปลี่ยนรหัส</a> -->
        <button class="btn btn-lg btn-default w-100 shadow" (click)="OnSubmit()"
            [disabled]="isChangePasswordDisabled()">{{"Change Password" | translate}}</button>
    </div>
    <div class="col-12 text-center mt-auto">
        <div class="row justify-content-center footer-info">
            <div class="col-auto">

            </div>
        </div>
    </div>
</div>
