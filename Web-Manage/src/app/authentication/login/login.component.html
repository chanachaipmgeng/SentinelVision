<div class="dpu-auth dpu-login">
  <!-- Time atmosphere (decorative) -->
  <div class="dpu-login__scene" aria-hidden="true">
    <div class="dpu-login__mesh"></div>
    <div class="dpu-login__orbit dpu-login__orbit--a"></div>
    <div class="dpu-login__orbit dpu-login__orbit--b"></div>
    <div class="dpu-login__orbit dpu-login__orbit--c"></div>

    <div class="dpu-login__clock">
      <div class="dpu-login__clock-glow"></div>
      <div class="dpu-login__clock-face">
        @for (tick of clockTicks; track tick) {
          <span
            class="dpu-login__tick"
            [class.dpu-login__tick--hour]="tick % 5 === 0"
            [style.--tick]="tick * 6 + 'deg'">
          </span>
        }
        <div class="dpu-login__hand dpu-login__hand--hour" [style.transform]="'rotate(' + hourDeg + 'deg)'"></div>
        <div class="dpu-login__hand dpu-login__hand--minute" [style.transform]="'rotate(' + minuteDeg + 'deg)'"></div>
        <div class="dpu-login__hand dpu-login__hand--second" [style.transform]="'rotate(' + secondDeg + 'deg)'"></div>
        <div class="dpu-login__hub"></div>
      </div>
    </div>

    <div class="dpu-login__readout">
      <span class="dpu-login__readout-time">{{ nowTime }}</span>
      <span class="dpu-login__readout-date">{{ nowDate }}</span>
    </div>

    <span class="dpu-login__float dpu-login__float--1">12:00</span>
    <span class="dpu-login__float dpu-login__float--2">CHECK-IN</span>
    <span class="dpu-login__float dpu-login__float--3">09:15</span>
  </div>

  <div class="dpu-auth__panel glass modern-card dpu-login__panel">
    <div class="dpu-auth__brand">
      <img src="./assets/images/brand-logos/logo.png" alt="DPU Time Attendance">
      <h1 class="dpu-auth__title">Time Attendance</h1>
      <p class="dpu-auth__subtitle">เข้าสู่ระบบจัดการหลังบ้าน</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      @if (errorMessage.length > 0) {
        <p class="dpu-auth__error">{{ errorMessage }}</p>
      }
      @if (_error.message.length > 0) {
        <p class="dpu-auth__error">{{ _error.message }}</p>
      }
      @if (error) {
        <p class="dpu-auth__error">{{ error }}</p>
      }

      <div class="grid grid-cols-12 gap-y-4">
        <div class="col-span-12">
          <label for="signin-username" class="form-label">ชื่อผู้ใช้</label>
          <input
            type="text"
            class="form-control form-control-lg w-full transition-all focus:ring-2 focus:ring-primary/50"
            id="signin-username"
            placeholder="Username"
            formControlName="username"
            autocomplete="username">
        </div>
        <div class="col-span-12">
          <label for="signin-password" class="form-label">รหัสผ่าน</label>
          <div class="input-group focus-within:ring-2 focus-within:ring-primary/50 transition-all rounded-s-md rounded-e-md">
            <input
              class="form-control form-control-lg !border-e-0 !rounded-s-md"
              id="signin-password"
              placeholder="Password"
              formControlName="password"
              autocomplete="current-password"
              [type]="showPassword ? 'text' : 'password'">
            <button
              aria-label="แสดงรหัสผ่าน"
              class="ti-btn ti-btn-light !rounded-s-none !mb-0 !border-s-0 bg-white dark:bg-bodybg"
              type="button"
              (click)="toggleVisibility()">
              <i class="ri-eye-{{ toggleClass }} align-middle"></i>
            </button>
          </div>
        </div>
        <div class="col-span-12 mt-4">
          <button
            type="submit"
            class="ti-btn ti-btn-primary dpu-auth__submit modern-btn w-full !text-lg !py-3"
            [disabled]="!loginForm.valid || showLoader"
            [class.loader--text]="showLoader">
            เข้าสู่ระบบ
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
