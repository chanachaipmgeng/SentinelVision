<!doctype html>
<html lang="th" dir="ltr" data-nav-layout="vertical" class="light dpu-theme-lock" data-header-styles="light" data-menu-styles="dark"
  data-vertical-style="overlay" data-page-style="modern" data-theme-mode="light">

<head>
  <meta charset="utf-8">
  <title>Sentinel by IVAP</title>
  <base href="/">
  <!-- <base href="/ynex-tailwind/preview/"> -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Spruko Technologies Private Limited">
  <meta name="keywords" content="tailwind template, angular front end, angular framework ,angular dashboard ,admin panel,angular,tailwind,admin template,template dashboard,ngbootstrap,template angular,admin,tailwind admin template,tailwind css,angular admin template,admin dashboard,dashboard
  ">
  <link rel="icon" type="image/x-icon" href="./assets/images/brand-logos/favicon.ico">
  <link rel="stylesheet" href="assets/JS/pace/themes/silver/pace-theme-flash.css" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    /> -->
  <style type="text/css">
    body,
    html {
      height: 100%;
    }

    .app-loading {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background-color: white;
    }

    .app-loading .spinner {
      height: 200px;
      width: 200px;
      animation: rotate 2s linear infinite;
      transform-origin: center center;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      margin: auto;
    }

    .app-loading .spinner .path {
      stroke-dasharray: 1, 200;
      stroke-dashoffset: 0;
      animation: dash 1.5s ease-in-out infinite;
      stroke-linecap: round;
      stroke: #ddd;
    }

    .app-loading .logo {
      width: 160px;
      height: 64px;
      background: url("assets/images/brand-logos/ivap-logo-dark.png") center center no-repeat;
      background-size: contain;

    }


    @keyframes rotate {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes dash {
      0% {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
      }

      50% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -35px;
      }

      100% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -124px;
      }
    }
  </style>
  <!-- The nonce placeholder below is replaced per request by the gateway
       (docker/nginx/snippets/gateway.conf); CSP script-src only allows inline scripts carrying it. -->
  <script type="text/javascript" nonce="__CSP_NONCE__">
    window.__dpuCspNonce = (document.currentScript && document.currentScript.nonce) || '';
    window.paceOptions = {
      document: true,
      eventLag: true,
      restartOnPushState: true,
      restartOnRequestAfter: true,
      ajax: {
        trackMethods: ['POST', 'GET']
      }
    };
  </script>
  <script src="assets/JS/pace/pace.js"></script>
</head>

<body>
  <script nonce="__CSP_NONCE__">
    // Called by Google Maps when the API key/referrer is rejected.
    window.gm_authFailure = function () {
      window.__dpuMapsAuthFailed = true;
    };
  </script>
  <!-- Google Maps SDK is injected at startup from assets/config.json (see src/app/shared/runtime-config.ts). Never hard-code the API key here. -->
  <app-root ngCspNonce="__CSP_NONCE__">
    <div class="app-loading">
      <div class="logo">
        <svg class="spinner" viewBox="25 25 50 50">
          <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="2" stroke-miterlimit="10" />
        </svg>
      </div>
    </div>
  </app-root>
</body>

</html>
