# Quad-API gateway: least_conn across 2 processes per GPU.
#   api + api-gpu0b → GPU0, api-gpu1 + api-gpu1b → GPU1.
# Mounted by docker-compose.gpu-x2.yml over default.dual-gpu.conf.
# Recreate nginx together with the API services so upstream IPs stay fresh.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream dpu_api {
    least_conn;
    server api:8000 max_fails=5 fail_timeout=10s;
    server api-gpu1:8000 max_fails=5 fail_timeout=10s;
    server api-gpu0b:8000 max_fails=5 fail_timeout=10s;
    server api-gpu1b:8000 max_fails=5 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:;" always;
    client_max_body_size 500m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # --- Face kiosk WebSocket (must precede general /face regex) ---
    # least_conn picks a backend per new connection; an established WS stays sticky.
    location ^~ /face/ws/ {
        proxy_pass http://dpu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/employees/.+/import$ {
        client_max_body_size 500m;
        proxy_pass http://dpu_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OIDC SSO redirect target is an Angular route: exact match beats the /auth API regex below.
    location = /auth/sso/callback {
        set $dpu_admin_sso http://admin:80;
        proxy_pass $dpu_admin_sso;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ~ ^/(auth|members|companys|company-locations|departments|positions|employees|timestamp|face|api|system|dashboard|images|enrolled_images|notifications|hr|sentinel|health|ready|metrics)(/|$) {
        client_max_body_size 500m;
        proxy_pass http://dpu_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /docs { return 404; }
    location /redoc { return 404; }
    location /openapi.json { return 404; }

    location = /mobile {
        return 301 /;
    }

    location /mobile/ {
        return 301 /;
    }

    location / {
        set $dpu_admin http://admin:80;
        proxy_pass $dpu_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
