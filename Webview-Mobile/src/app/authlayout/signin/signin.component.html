<div class="row h-100 overflow-auto"
  style="background:url('assets/img/background/bg2.jpg'); background-repeat: no-repeat; background-size: cover; background-attachment: fixed;">

  <div class="card col-10 col-md-6 col-lg-5 col-xl-3 mx-auto align-self-center text-center py-4" style="background-color: white;">
    <div class="col-12 text-center mb-auto px-0">

      <div class="row mb-4 ">
        <div class="col-auto"></div>
        <div class="col">
          <div>
            <img src="assets/img/icon/logo2.png" alt="" style="width: 250px;">
          </div>
        </div>
        <div class="col-auto"></div>
      </div>

    </div>
    <h1 class="mb-4 text-color-theme">Sign in</h1>
    <form class="needs-validation" novalidate (submit)="onSubmit()">
      <div class="form-group form-floating mb-3 is-valid">
        <input type="text" class="form-control" value="maxartkiller" id="email" placeholder="Username"
          [(ngModel)]="username" [ngModelOptions]="{ standalone: true }" (ngModelChange)="msg = ''" />
        <label class="form-control-label" for="email">Username</label>
        <button type="button" class="text-danger tooltip-btn" data-bs-toggle="tooltip" data-bs-placement="left"
          title="Enter valid Username" id="passworderror" *ngIf="!username">
          <i class="bi bi-info-circle"></i>
        </button>
      </div>

      <div class="form-group form-floating is-invalid mb-3">
        <input [type]="PassWord ? 'text' : 'password'" class="form-control" id="password" placeholder="Password"
          [(ngModel)]="password" [ngModelOptions]="{ standalone: true }" (ngModelChange)="msg = ''" />
        <label class="form-control-label" for="password">Password</label>
        <button type="button" class="text-danger tooltip-btn" data-bs-toggle="tooltip" data-bs-placement="left"
          title="Enter valid Password" id="passworderror" *ngIf="!password">
          <i class="bi bi-info-circle"></i>
        </button>
        <button type="button" class="btn btn-link text-default tooltip-btn" data-bs-toggle="tooltip"
          (click)="showPassWord()" data-bs-placement="left" title="Show Password" id="pass" *ngIf="password">
          <!-- <i class="bi bi-eye"></i> -->
          <i class="bi" [ngClass]="PassWord ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>
      <p class="mb-3 text-center text-danger" *ngIf="msg">
        {{ msg }}
      </p>

      <button type="submit" class="btn btn-lg btn-default w-100 mb-4 shadow">
        เข้าสู่ระบบ
      </button>
    </form>
    <!-- <p class="mb-2 text-muted">คุณยังไม่ได้ลงทะเบียนใช่หรือไม่?</p>
    <a routerLink="/auth/signup" target="_self" class="">
      ลงทะเบียน <i class="bi bi-arrow-right"></i>
    </a> -->

  </div>
