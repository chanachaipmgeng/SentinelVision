# TLS termination inside dpu-nginx (alternative to a host nginx edge, tls-edge.example.conf).
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.prod.yml \
#     -f docker-compose.tls.yml up -d
#
# Put the certificate chain and key in ${TLS_CERT_DIR:-./certs} as fullchain.pem / privkey.pem
# (Let's Encrypt layout: `ln -s /etc/letsencrypt/live/<host> certs`, or copy them). The key
# must be readable by uid 101 (`chmod 644` on a copy, or group-readable with `chgrp 101`).
# On start the gateway renders a 8443 listener (TLSv1.2/1.3, HSTS) and redirects plain HTTP
# — except loopback /health probes — to https://<host>[:HTTPS_PORT]. Renewal: replace the
# files and `docker compose ... exec nginx nginx -s reload` (or `up -d --force-recreate nginx`).
services:
  nginx:
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      TLS_ENABLED: "true"
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
