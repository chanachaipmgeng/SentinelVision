# Load-test overlay — run the generator on the server next to nginx.
# Usage (from repo root on 10.50.0.117):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#     -f docker-compose.loadtest.yml run --rm \
#     -e KIOSK_LOAD_USER=... -e KIOSK_LOAD_PASSWORD=... \
#     loadgen --profile idle --kiosks 1,2,4 --hold 30 --jsonl /results/idle.jsonl
#
# Results land in scripts/kiosk-load/.cache/results/ (bind-mounted).
services:
  loadgen:
    profiles: ["loadtest"]
    build:
      context: ./scripts/kiosk-load
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      KIOSK_LOAD_BASE_URL: ${KIOSK_LOAD_BASE_URL:-http://nginx:80}
      KIOSK_LOAD_USER: ${KIOSK_LOAD_USER:-}
      KIOSK_LOAD_PASSWORD: ${KIOSK_LOAD_PASSWORD:-}
      KIOSK_LOAD_COMPANY_ID: ${KIOSK_LOAD_COMPANY_ID:-11111111-1111-1111-1111-111111111111}
      KIOSK_LOAD_MEMBER_ID: ${KIOSK_LOAD_MEMBER_ID:-aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa4}
      KIOSK_LOAD_FRAME_WIDTH: ${KIOSK_LOAD_FRAME_WIDTH:-1280}
      KIOSK_LOAD_JPEG_QUALITY: ${KIOSK_LOAD_JPEG_QUALITY:-70}
    volumes:
      - ./scripts/kiosk-load/.cache:/app/.cache
      - ./scripts/kiosk-load/.cache/results:/results
    depends_on:
      nginx:
        condition: service_healthy
    # Prefer host network DNS via compose network (default); do not publish ports.
    restart: "no"
