# Trivy allow-list for the CI security gate (.github/workflows/ci.yml, job "security").
#
# Rules:
#   * every entry needs a `statement` (why it is acceptable) and an `expired_at` date — when the
#     date passes the gate fails again and the entry must be re-justified or the finding fixed;
#   * never allow-list a finding that is actually fixable in place (bump the dependency instead);
#   * keep the list short. Fixing beats ignoring.
#
# Format: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml

vulnerabilities:
  # swiper is consumed as SCSS only (src/styles.scss imports swiper/scss*); the JavaScript that
  # carries the prototype-pollution bug is never bundled. Removing the dependency means
  # re-styling the landing/auth carousels — tracked in docs/BACKLOG.md "Lint debt / deps".
  - id: CVE-2026-27212
    paths:
      - Web-Manage/package-lock.json
    statement: "swiper@8 is used for its SCSS only; the vulnerable JS is not shipped."
    expired_at: 2027-03-31

  # Angular 17.3.x (EOL) framework advisories. Fixes exist only in Angular >= 19; the upgrade is a
  # dedicated project (standalone APIs, control flow, Material 3 migration) tracked in
  # docs/BACKLOG.md "Open — Phase B follow-ups". Exposure is limited: the admin UI is served
  # behind the same origin as the API (no cross-origin XSRF leak), does not use HttpTransferCache,
  # hydration, i18n attribute bindings or SVG animation templates, and only authenticated users
  # reach it.
  - id: CVE-2025-66035
    paths: [Web-Manage/package-lock.json]
    statement: "Angular 17 EOL; fixed in >=19. Upgrade tracked in BACKLOG."
    expired_at: 2027-03-31
