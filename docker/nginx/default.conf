# Gateway: admin (/) + FastAPI
# Use Docker embedded DNS so upstream IPs refresh after recreate
# (plain `upstream { server api:8000; }` is resolved once at start → stale 502).

# Preserve HTTPS when TLS terminates in front of this container.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Kiosk WebSocket connection cap per client IP (A3 hardening).
# Default 16 matches WS_KIOSK_MAX_CONN_PER_IP in the API; raise both for load tests
# or many kiosks behind one NAT. Excess handshakes get HTTP 429 (no upstream, no GPU).
limit_conn_zone $binary_remote_addr zone=kiosk_ws_per_ip:10m;
limit_conn_log_level warn;

server {
    # Behind a host TLS edge (tls-edge.example.conf) every socket arrives from the
    # docker bridge / loopback; recover the real client so limit_conn and the API's
    # per-IP cap are per kiosk, not per edge. Only private ranges are trusted.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    listen 80;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:;" always;
    # Face / profile / employee-import uploads.
    # If https://host still returns 413, raise the HOST TLS nginx too
    # (see host-upload-limit.conf / tls-edge.example.conf).
    client_max_body_size 500m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # --- Face kiosk WebSocket (must precede general /face regex) ---
    location ^~ /face/ws/ {
        limit_conn kiosk_ws_per_ip 16;
        limit_conn_status 429;
        set $dpu_api http://api:8000;
        proxy_pass $dpu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Excel + optional face-photo ZIP (must precede the general API regex)
    location ~ ^/employees/.+/import$ {
        set $dpu_api http://api:8000;
        client_max_body_size 500m;
        proxy_pass $dpu_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OIDC SSO redirect target is an Angular route: exact match beats the /auth API regex below.
    location = /auth/sso/callback {
        set $dpu_admin_sso http://admin:80;
        proxy_pass $dpu_admin_sso;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # --- FastAPI (same-origin for Angular baseUrl='') ---
    location ~ ^/(auth|members|companys|company-locations|departments|positions|employees|timestamp|face|api|system|dashboard|images|enrolled_images|notifications|hr|sentinel|health|ready|metrics)(/|$) {
        set $dpu_api http://api:8000;
        client_max_body_size 500m;
        proxy_pass $dpu_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API docs stay off the public gateway. Enable only on a private network.
    location /docs { return 404; }
    location /redoc { return 404; }
    location /openapi.json { return 404; }

    # Former employee mobile app — removed; send clients to admin.
    location = /mobile {
        return 301 /;
    }

    location /mobile/ {
        return 301 /;
    }

    # --- Admin (default) ---
    location / {
        set $dpu_admin http://admin:80;
        proxy_pass $dpu_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
