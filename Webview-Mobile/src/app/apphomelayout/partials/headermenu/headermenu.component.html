<header class="dpu-topbar">
  <button type="button" class="dpu-topbar__btn" (click)="isBack ? backnav() : menuopen()" aria-label="Menu">
    <i class="bi" [ngClass]="isBack ? 'bi-arrow-left' : 'bi-list'"></i>
  </button>

  <div class="dpu-topbar__title">
    <h1>{{ pageInfo?.title | translate }}</h1>
  </div>

  <div class="dpu-topbar__spacer"></div>
</header>
