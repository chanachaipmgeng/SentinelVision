<div class="card shadow-sm border-0 mb-3">
  <div class="card border-0">
    <div class="card-body">
      <div class="row">
        <div class="col-auto">
          <figure class="avatar rounded-15">
            <img style="object-fit: cover;" src="{{companyModel.getPicture()}}">
          </figure>
        </div>
      </div>


    </div>
    <div class="row">
      <div class="col-12">
        <div class="card">
          <ul class="list-group list-group-flush bg-none">
            <li class="list-group-item">
              <div class="row p-1 text-normal d-block">
                <a class="text-normal d-block">
                  {{companyModel.companyName}}
                </a>
              </div>
            </li>
            <li class="list-group-item">
              <div class="row p-1 text-normal d-block">
                <a class="text-normal d-block">
                  <i class="bi bi-envelope mx-2"></i>
                  {{companyModel.ownerName}}
                </a>
              </div>
            </li>
            <li class="list-group-item">
              <div class="row  p-1">
                <a class="text-normal d-block">
                  <i class="bi bi-telephone mx-2"></i>
                  {{companyModel.contact}}
                </a>
              </div>
            </li>
            <li class="list-group-item">
              <div class="row  p-1">
                <a class="text-normal d-block">
                  <i class="bi bi-house mx-2"></i>
                  {{companyModel.address}}
                </a>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

</div>



<div class="row justify-content-center">
  <div class="col-12 col-md-6  mb-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <app-dpu-location-map
          [latitude]="companyModel.latitude"
          [longitude]="companyModel.longitude"
          [height]="300">
        </app-dpu-location-map>
      </div>
    </div>
  </div>
</div>
