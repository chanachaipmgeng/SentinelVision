<div class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="row">
      <div class="col-auto">
        <figure class="avatar avatar-70 rounded-10">
          <img appShowLoading *ngIf="employee.getPicture() ;else personblank" src="{{employee.getPicture()}}">
          <ng-template #personblank>
            <img src="assets/img/icon/person.png">
          </ng-template>
        </figure>
      </div>
      <div class="col px-0 align-self-center">
        <h3 class="mb-0 text-color-theme">{{employee.getFullname()}}</h3>
        <p class="text-muted ">{{employee.position.getName()}}</p>
      </div>
    </div>
  </div>
</div>

<div class="row mb-3">
  <div class="col">
    <h6>{{"Subordinate" | translate}}</h6>
  </div>
</div>
<div class="row">
  <div class="col-12">
    <div class="card shadow-sm mb-4">
      <ul class="list-group list-group-flush bg-none">
        <li class="list-group-item">
          <div class="row p-1">
            <a routerLink="/company/subordinate-data" class="text-normal d-block">
              <i class="bi bi-people mx-2"></i>
              {{"Subordinate List" | translate}}
              <i class="float-end bi bi-chevron-right"></i>
            </a>
          </div>
        </li>
        <li class="list-group-item">
          <div class="row  p-1">
            <a routerLink="/company/subordinate-warning" class="text-normal d-block">
              <i class="bi bi-exclamation-circle mx-2"></i>
              {{"Warning Timestamp" | translate}}
              <i class="float-end bi bi-chevron-right"></i>
            </a>
          </div>
        </li>
        <li class="list-group-item">
          <div class="row p-1">
            <a routerLink="/company/subordinate-timestamp" class="text-normal d-block">
              <i class="bi bi-clock mx-2"></i>
              {{"Timestamp" | translate}}
              <i class="float-end bi bi-chevron-right"></i>
            </a>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
