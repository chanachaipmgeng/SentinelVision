# Dual-GPU gateway: least_conn across api (GPU0) + api-gpu1 (GPU1).
# Mounted by docker-compose.gpu.yml over the single-upstream default.conf.
# Recreate nginx together with the API services so upstream IPs stay fresh.
# Routing, rate limits, internal-only endpoints and security headers come from
# snippets/gateway.conf (baked into the image — rebuild nginx when snippets change).

upstream dpu_api {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=20s;
    server api-gpu1:8000 max_fails=3 fail_timeout=20s;
}

server {
    # least_conn picks a backend per new connection; an established WS stays sticky.
    set $dpu_api http://dpu_api;
    include /etc/nginx/snippets/gateway.conf;
}
