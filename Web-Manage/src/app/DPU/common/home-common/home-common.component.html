<app-page-header [title]="'Home'" [activeTitle]="'Home'" [title1]="'Home'"></app-page-header>

<div class="dpu-admin-home grid grid-cols-12 gap-x-6 gap-y-4">
  <div class="col-span-12">
    <app-page-toolbar title="ศูนย์ผู้ดูแลระบบ">
      <ng-container chips>
        <app-stat-chip>Admin</app-stat-chip>
        <app-stat-chip tone="soft">จัดการผู้ใช้ · บริษัท · สิทธิ์</app-stat-chip>
      </ng-container>
    </app-page-toolbar>
  </div>

  <div class="col-span-12">
    <div class="box modern-card glass animate-in fade-in slide-in-from-bottom-4 duration-500">
      <div class="box-body">
        <p class="dpu-admin-home__welcome mb-0">
          เลือกเมนูด้านล่างเพื่อจัดการสมาชิก บริษัท และสิทธิ์ผู้ดูแล — หรือใช้เมนูด้านข้างเพื่อเข้าสู่บริษัท
        </p>
      </div>
    </div>
  </div>

  <div class="col-span-12">
    <div class="box modern-card glass animate-in fade-in slide-in-from-bottom-4 duration-500 delay-75">
      <div class="box-header">
        <h5 class="box-title !mb-0">เมนูด่วน</h5>
      </div>
      <div class="box-body">
        <div class="dpu-admin-home__links">
          @for (link of links; track link.route) {
            <a [routerLink]="link.route" class="dpu-admin-home__link">
              <i [ngClass]="link.icon"></i>
              <span class="dpu-admin-home__link-text">
                <strong>{{ link.label }}</strong>
                <em>{{ link.hint }}</em>
              </span>
              <i class="ri-arrow-right-s-line dpu-admin-home__chevron"></i>
            </a>
          }
        </div>
      </div>
    </div>
  </div>
</div>
