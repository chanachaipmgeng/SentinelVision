server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 500m;

    # Per-deployment runtime config (written by /docker-entrypoint.d/40-runtime-config.sh) — never cache
    location = /assets/config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hash-based Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
