<div class="dpu-scan">
  <div class="dpu-scan__viewport card shadow-sm">
    <video #video width="640" height="480"
      style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"
      autoplay muted playsinline>
    </video>

    <canvas #canvas width="640" height="480"
      style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
    </canvas>

    <div class="dpu-scan__overlay">
      <p class="dpu-scan__message">{{ captureMessage }}</p>

      <div *ngIf="isCapturing" class="progress mb-2">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-success"
          role="progressbar" [style.width.%]="captureProgress"></div>
      </div>

      <div *ngIf="!isCapturing">
        <div *ngIf="locationArea.length === 0" class="note-box mb-2">
          <label class="text-white small d-block mb-1">อยู่นอกพื้นที่ — กรอกเหตุผลก่อนลงเวลา</label>
          <textarea class="form-control" rows="2" [(ngModel)]="outOfAreaNote"
            placeholder="เช่น ไปพบลูกค้า / WFH"></textarea>
        </div>
        <button (click)="onCheckInClick()" [disabled]="isCapturing" class="btn btn-primary dpu-scan__cta">
          ลงเวลา Check-In
        </button>
      </div>
    </div>
  </div>
</div>
