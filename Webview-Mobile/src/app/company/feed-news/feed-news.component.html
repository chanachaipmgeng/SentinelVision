<!-- Blogs -->
<div class="row mb-3">
  <div class="col">
    <h6 class="title">กิจกรรม</h6>
  </div>
  <!-- <div class="col-auto align-self-center">
    <a routerLink="/blog" class="small">Read more</a>
  </div> -->
</div>
<div class="row">
  <div class="col-12 col-md-6 mb-3" *ngFor="let item of tevent">
    <div class="row" >
      <div class="col-5">
        <figure (click)="openModalEventDetail(item)" class="rounded-15 position-relative h-190 overflow-hidden shadow-sm">
          <div class="coverimg h-100 w-100 position-absolute start-0 top-0"
            style="background-image: url('{{item?.getPictureUrl()}}');">
            <img src="{{item?.getPictureUrl()}}" alt="" class="d-none">
          </div>
        </figure>
      </div>
      <div class="col align-self-center">
        <a (click)="openModalEventDetail(item)" class="h5 d-block text-normal mb-2">{{item?.getTopicDesc()}}</a>
        <p class="small text-muted">{{item?.getPlaceDesc()}}</p>
        <a (click)="openModalEventDetail(item)" class="text-normal small">Read More <i class="bi bi-chevron-right"></i></a>
      </div>
    </div>
  </div>
</div>
