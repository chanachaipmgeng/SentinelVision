<app-page-header [title]="'หน้าหลัก'" [activeTitle]="'ระบบ'" [title1]="'หน้าหลัก'"></app-page-header>

<div class="grid grid-cols-12 gap-x-6">
  <div class="xl:col-span-4 lg:col-span-6 col-span-12">
    <div class="box dpu-stat-card">
      <div class="box-body">
        <p class="dpu-stat-card__label">จัดการระบบ</p>
        <p class="dpu-stat-card__value">Admin</p>
        <p class="text-dpu-muted text-[0.85rem] mt-2">ศูนย์กลางจัดการผู้ใช้ บริษัท และพนักงาน</p>
      </div>
    </div>
  </div>

  <div class="xl:col-span-4 lg:col-span-6 col-span-12">
    <div class="box dpu-stat-card">
      <div class="box-body">
        <p class="dpu-stat-card__label">บริษัท</p>
        <p class="dpu-stat-card__value">Company</p>
        <p class="text-dpu-muted text-[0.85rem] mt-2">ตั้งค่าบริษัท ลงเวลา และใบหน้า</p>
      </div>
    </div>
  </div>

  <div class="xl:col-span-4 lg:col-span-12 col-span-12">
    <div class="box dpu-stat-card">
      <div class="box-body">
        <p class="dpu-stat-card__label">ความปลอดภัย</p>
        <p class="dpu-stat-card__value">Secure</p>
        <p class="text-dpu-muted text-[0.85rem] mt-2">ระบบลงเวลาด้วยใบหน้าและตำแหน่ง</p>
      </div>
    </div>
  </div>

  <div class="col-span-12">
    <div class="box">
      <div class="box-header">
        <h5 class="box-title">เมนูด่วน</h5>
      </div>
      <div class="box-body">
        <div class="grid grid-cols-12 gap-4">
          <div class="xl:col-span-4 md:col-span-6 col-span-12">
            <a routerLink="/admin/member-manage" class="dpu-quick-link">
              <i class="ri-team-line"></i>
              <span>จัดการสมาชิก</span>
            </a>
          </div>
          <div class="xl:col-span-4 md:col-span-6 col-span-12">
            <a routerLink="/admin/manage-companys" class="dpu-quick-link">
              <i class="ri-building-line"></i>
              <span>จัดการบริษัท</span>
            </a>
          </div>
          <div class="xl:col-span-4 md:col-span-6 col-span-12">
            <a routerLink="/admin/admin-manage" class="dpu-quick-link">
              <i class="ri-shield-user-line"></i>
              <span>ผู้ดูแลระบบ</span>
            </a>
          </div>
          <div class="xl:col-span-4 md:col-span-6 col-span-12">
            <a routerLink="/admin/emp/department" class="dpu-quick-link">
              <i class="ri-organization-chart"></i>
              <span>แผนก</span>
            </a>
          </div>
          <div class="xl:col-span-4 md:col-span-6 col-span-12">
            <a routerLink="/admin/emp/position" class="dpu-quick-link">
              <i class="ri-briefcase-line"></i>
              <span>ตำแหน่ง</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
