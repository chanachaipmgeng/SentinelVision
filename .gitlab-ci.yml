# GitLab mirror of .github/workflows/ci.yml (Phase B3). Same gates, same commands, no allow_failure.
# Baselines: API-Fast/pyproject.toml (ruff/mypy), Web-Manage/.eslintrc.json (eslint), .trivyignore.yaml (trivy).

stages:
  - test
  - e2e
  - security
  - build

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TRIVY_VERSION: "v0.76.2"

backend:
  stage: test
  image: python:3.11
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: dpu_test
    TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dpu_test
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dpu_test
    AUTH_FAIL_FAST: "false"
    MIGRATE_ON_STARTUP: "false"
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  before_script:
    - cd API-Fast
    - grep -v -E '^(insightface|onnxruntime|onnx)([-=<>! \[]|$)' requirements.txt > /tmp/requirements-ci.txt
    - grep -v -E '^pgserver' requirements-dev.txt > /tmp/requirements-dev-ci.txt
    - pip install --cache-dir ../.cache/pip -r /tmp/requirements-ci.txt -r /tmp/requirements-dev-ci.txt ruff mypy
    - pip check
  script:
    - ruff check .
    - mypy
    - alembic upgrade head && alembic check && alembic downgrade -1 && alembic upgrade head
    - python -m pytest -q -p no:cacheprovider --durations=15

frontend:
  stage: test
  image: node:20-bookworm
  variables:
    NODE_OPTIONS: --max-old-space-size=6144
    CHROME_BIN: /usr/bin/chromium
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [.cache/npm]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends chromium > /dev/null
    - cd Web-Manage
    - npm ci --cache ../.cache/npm
  script:
    - npm run lint
    - npm run test:ci
    - '[ -f src/assets/config.json ] || cp src/assets/config.example.json src/assets/config.json'
    - npm run build:prod
  artifacts:
    when: always
    expire_in: 1 week
    paths: [Web-Manage/coverage]

e2e:
  stage: e2e
  image: docker:27
  services:
    - docker:27-dind
  variables:
    POSTGRES_PASSWORD: ci-e2e-postgres-password-change-me
    SECRET_KEY: ci-e2e-secret-key-at-least-32-chars-long
    HTTP_PORT: "8880"
    APP_ENV: development
    MIGRATE_ON_STARTUP: "true"
    FACE_DEVICE: cpu
    FACE_DEVICES: cpu
    AUTH_FAIL_FAST: "false"
    DPU_BASE_URL: http://127.0.0.1:8880
    DPU_E2E_USER: admin
    DPU_E2E_PASSWORD: "Password123!"
    DPU_E2E_COMPANY_ID: 11111111-1111-1111-1111-111111111111
    COMPOSE_PROJECT_NAME: dpu-e2e
    FF_NETWORK_PER_BUILD: "true"
  before_script:
    - apk add --no-cache curl nodejs npm bash
  script:
    - set -euo pipefail
    - docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build
    - |
      for i in $(seq 1 60); do
        code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8880/health || true)
        ready=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8880/ready || true)
        if [ "$code" = "200" ] && [ "$ready" = "200" ]; then
          echo "stack healthy after ${i} attempts"
          break
        fi
        if [ "$i" -eq 60 ]; then
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml ps
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml logs --tail=80 api
          exit 1
        fi
        sleep 10
      done
    - docker compose -f docker-compose.yml -f docker-compose.cpu.yml run --rm --entrypoint python api scripts/seed_demo_data.py --reset
    - cd Web-Manage && npm ci && npx playwright install --with-deps chromium && npm run test:e2e:smoke
  after_script:
    - docker compose -f docker-compose.yml -f docker-compose.cpu.yml down --remove-orphans || true

trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:0.76.2
    entrypoint: [""]
  cache:
    key: trivy-db
    paths: [.cache/trivy]
  variables:
    TRIVY_CACHE_DIR: .cache/trivy
  script:
    - trivy fs --config trivy.yaml --scanners vuln,secret,misconfig .

images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: [backend, frontend, e2e, trivy-fs]
  parallel:
    matrix:
      - NAME: api
        CONTEXT: ./API-Fast
        DOCKERFILE: ./API-Fast/Dockerfile.cpu
      - NAME: admin
        CONTEXT: ./Web-Manage
        DOCKERFILE: ./Web-Manage/Dockerfile
      - NAME: nginx
        CONTEXT: ./docker/nginx
        DOCKERFILE: ./docker/nginx/Dockerfile
      - NAME: backup
        CONTEXT: .
        DOCKERFILE: ./docker/backup/Dockerfile
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "$TRIVY_VERSION"
  script:
    - docker build -f "$DOCKERFILE" -t "dpu/$NAME:ci" "$CONTEXT"
    - trivy image --config trivy.yaml --scanners vuln "dpu/$NAME:ci"

compose-config:
  stage: build
  image: docker:27
  variables:
    # B4: POSTGRES_PASSWORD / SECRET_KEY have no compose defaults; throw-away values for `config` only.
    POSTGRES_PASSWORD: ci-only-not-a-real-password
    SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdef
    GRAFANA_ADMIN_PASSWORD: ci-only-grafana
    FACE_CORE_API_KEY: ci-only-face-core-key
  script:
    - docker compose -f docker-compose.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.cpu.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.observability.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.observability.yml -f docker-compose.loki.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.backup.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.tls.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.face-core-remote.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.prod.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.external-db.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.gpu-x2.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.gpu-x2.yml -f docker-compose.gpu-x3.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.prod.yml -f docker-compose.tls.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.prod.yml -f docker-compose.backup.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.prod.yml -f docker-compose.observability.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.prod.yml -f docker-compose.observability.yml -f docker-compose.loki.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.prod.yml -f docker-compose.tls.yml -f docker-compose.backup.yml -f docker-compose.observability.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.cpu.yml -f docker-compose.prod.yml -f docker-compose.api-readonly.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.cpu.yml -f docker-compose.observability.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.cpu.yml -f docker-compose.observability.yml -f docker-compose.loki.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.face-core.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.loadtest.yml --profile loadtest config -q
