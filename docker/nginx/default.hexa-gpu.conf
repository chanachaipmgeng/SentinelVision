# Hexa-API gateway: least_conn across 3 processes per GPU (6 total).
#   api + api-gpu0b + api-gpu0c → GPU0
#   api-gpu1 + api-gpu1b + api-gpu1c → GPU1
# Mounted by docker-compose.gpu-x3.yml.
# Recreate nginx together with the API services so upstream IPs stay fresh.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Kiosk WebSocket connection cap per client IP (A3 hardening).
# Default 16 matches WS_KIOSK_MAX_CONN_PER_IP in the API; raise both for load tests
# or many kiosks behind one NAT. Excess handshakes get HTTP 429 (no upstream, no GPU).
limit_conn_zone $binary_remote_addr zone=kiosk_ws_per_ip:10m;
limit_conn_log_level warn;

upstream dpu_api {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=20s;
    server api-gpu1:8000 max_fails=3 fail_timeout=20s;
    server api-gpu0b:8000 max_fails=3 fail_timeout=20s;
    server api-gpu1b:8000 max_fails=3 fail_timeout=20s;
    server api-gpu0c:8000 max_fails=3 fail_timeout=20s;
    server api-gpu1c:8000 max_fails=3 fail_timeout=20s;
}

server {
    # Behind a host TLS edge (tls-edge.example.conf) every socket arrives from the
    # docker bridge / loopback; recover the real client so limit_conn and the API's
    # per-IP cap are per kiosk, not per edge. Only private ranges are trusted.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;
    listen 80;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:;" always;
    client_max_body_size 500m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # --- Face kiosk WebSocket (must precede general /face regex) ---
    # least_conn picks a backend per new connection; an established WS stays sticky.
    location ^~ /face/ws/ {
        limit_conn kiosk_ws_per_ip 16;
        limit_conn_status 429;
        proxy_pass http://dpu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/employees/.+/import$ {
        client_max_body_size 500m;
        proxy_pass http://dpu_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(auth|members|companys|company-locations|departments|positions|employees|timestamp|face|api|system|dashboard|images|enrolled_images|notifications|health|ready|metrics)(/|$) {
        client_max_body_size 500m;
        proxy_pass http://dpu_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /docs { return 404; }
    location /redoc { return 404; }
    location /openapi.json { return 404; }

    location = /mobile {
        return 301 /;
    }

    location /mobile/ {
        return 301 /;
    }

    location / {
        set $dpu_admin http://admin:80;
        proxy_pass $dpu_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
