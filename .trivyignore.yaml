# Trivy allow-list for the CI security gate (.github/workflows/ci.yml, job "security").
#
# Rules:
#   * every entry needs a `statement` (why it is acceptable) and an `expired_at` date — when the
#     date passes the gate fails again and the entry must be re-justified or the finding fixed;
#   * never allow-list a finding that is actually fixable in place (bump the dependency instead);
#   * keep the list short. Fixing beats ignoring.
#
# Format: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml

vulnerabilities:
  # API images (trivy image, target "Python"): pip >= 25 ships pip/_vendor/bom.cdx.json, a CycloneDX
  # SBOM that declares its vendored pkg_resources as setuptools==70.3.0. Only pkg_resources is
  # vendored; setuptools/package_index.py (the PackageIndex path-traversal) is not in the image. The
  # real setuptools install is upgraded in the Dockerfiles (`pip install --upgrade pip setuptools
  # wheel`) and reports clean. Goes away once pip bumps its vendored copy — re-check on expiry.
  - id: CVE-2025-47273
    purls: ["pkg:pypi/setuptools@70.3.0"]
    statement: "pip's vendored pkg_resources SBOM entry; the vulnerable PackageIndex module is not shipped."
    expired_at: 2027-03-31
