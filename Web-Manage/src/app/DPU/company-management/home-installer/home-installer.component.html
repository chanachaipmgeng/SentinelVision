<app-page-header [title]="'หน้าบริษัท'" [activeTitle]="'จัดการบริษัท'" [title1]="'หน้าบริษัท'"></app-page-header>

<div class="dpu-company-home grid grid-cols-12 gap-x-6 gap-y-4">
  <div class="col-span-12">
    <app-page-toolbar title="ยินดีต้อนรับ">
      <ng-container chips>
        <app-stat-chip *ngIf="company">{{ company.companyCode || company.companyId }}</app-stat-chip>
        <app-stat-chip tone="ok" *ngIf="company">พร้อมใช้งาน</app-stat-chip>
        <app-stat-chip tone="danger" *ngIf="error">ผิดพลาด</app-stat-chip>
      </ng-container>
    </app-page-toolbar>
  </div>

  <div class="col-span-12" *ngIf="loading">
    <div class="box modern-card glass">
      <div class="box-body">
        <app-empty-state [loading]="true" message="กำลังโหลดข้อมูลบริษัท..."></app-empty-state>
      </div>
    </div>
  </div>

  <div class="col-span-12" *ngIf="error && !loading">
    <div class="box modern-card glass">
      <div class="box-body flex flex-wrap items-center justify-between gap-3">
        <div>
          <div class="font-semibold text-danger">โหลดไม่สำเร็จ</div>
          <div class="text-sm text-dpu-muted">{{ error }}</div>
        </div>
        <button type="button" class="ti-btn ti-btn-primary-full modern-btn" (click)="loadCompany()">ลองใหม่</button>
      </div>
    </div>
  </div>

  <ng-container *ngIf="company && !loading">
    <div class="col-span-12">
      <div class="box modern-card glass dpu-company-home__hero animate-in fade-in slide-in-from-bottom-4 duration-500">
        <div class="box-body">
          <div class="dpu-company-home__hero-inner">
            <span class="avatar avatar-xl avatar-rounded">
              <img [src]="company.getPicture()" [alt]="company.companyName">
            </span>
            <div class="min-w-0">
              <p class="dpu-company-home__eyebrow">บริษัทที่เลือก</p>
              <h2 class="dpu-company-home__title">{{ company.companyName }}</h2>
              <p class="dpu-company-home__meta mb-0">
                {{ company.companyInfo || 'พร้อมจัดการพนักงาน ลงเวลา และ kiosk ใบหน้า' }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-span-12">
      <div class="box modern-card glass animate-in fade-in slide-in-from-bottom-4 duration-500 delay-75">
        <div class="box-header">
          <h5 class="box-title !mb-0">เมนูด่วน</h5>
        </div>
        <div class="box-body">
          <div class="dpu-company-home__links">
            @for (link of links; track link.route) {
              <a [routerLink]="link.route" class="dpu-company-home__link">
                <i [ngClass]="link.icon"></i>
                <span class="dpu-company-home__link-text">
                  <strong>{{ link.label }}</strong>
                  <em>{{ link.hint }}</em>
                </span>
                <i class="ri-arrow-right-s-line dpu-company-home__chevron"></i>
              </a>
            }
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
