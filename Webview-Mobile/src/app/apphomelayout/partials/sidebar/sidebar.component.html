<div class="sidebar dark-bg">
  <!-- user information -->
  <div class="row my-3">
    <div class="col-12 ">
      <div class="shadow-none border-0">
        <div class="row">
          <div class="col-auto">
            <figure class="avatar avatar-70 rounded-15">
              <img src="{{employeeModel?.getPicture()}}">
              <ng-template #personblank>
                <img src="assets/img/icon/person.png">
              </ng-template>
            </figure>
          </div>
          <div class="col align-self-center text-end">
            <i class="bi bi-x-lg fw-bolder text-muted " (click)="menuclose()"></i>
            <!-- <button routerLink="/company/company-list" routerLinkActive="active" target="_self"
                  (click)="menuclose()" class="btn btn-44 btn-light">
                  <i class="bi bi-building"></i>
                </button> -->
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-auto">
            <p class="text-color-theme fw-bold-600 mb-0 mb-1">{{employeeModel?.getFullname()}}</p>
            <p class="text-muted size-12">{{companyModel.companyName}} ,{{employeeModel?.position?.getName()}}</p>
            <!-- <p class="text-muted">{{employeeModel?.companyName}}</p> -->
          </div>
          <div class="col text-end">
            <button routerLink="/company/company-list" routerLinkActive="active" target="_self" (click)="menuclose()"
              class="btn btn-44  bg-light">
              <img src="../assets/img/icon-menu/company-list.png" class="img-menu">

            </button>
          </div>
        </div>

  <div class="row">

      <ul class="nav nav-pills">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/company/home-company" routerLinkActive='active'

            <div class="avatar avatar-40 rounded icon rounded-circle bg-light shadow-md"
              [ngStyle]="{'color': '#3665aa'}"><img src="../assets/img/icon-menu/home.png" class="img-menu"></div>
            <div class="col mt-2">{{"Home" | translate}}</div>
            <div class="arrow"><i class="bi bi-chevron-right"></i></div>
          </a>
        </li>
        <ng-container *ngFor="let item of listMenu; let i=index">
          <li class="nav-item" *ngIf="item.link">
            <a class="nav-link" aria-current="page" [routerLink]="item.link" routerLinkActive='active'
              (click)="menuclose()">
              <div class="avatar avatar-40 rounded icon rounded-circle bg-light shadow-md"><img src="{{item.icon}}"
                  class="img-menu"></div>
              <div class="col mt-2">{{item.name | translate}}</div>
              <div class="arrow"><i class="bi bi-chevron-right"></i></div>
            </a>
          </li>
        </ng-container>
