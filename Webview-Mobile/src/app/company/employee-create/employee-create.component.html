<!-- user information -->
<div class="card shadow-sm mb-4">
    <div [ngClass]="{'card-header':!hideUploandImg,'card-body':hideUploandImg}">
        <div class="row">
            <div class="col-auto">
                <figure class="avatar avatar-70 rounded-10">
                    <img *ngIf="profilePhotoFileName != '' ;else personblank" src="{{profilePhotoFileName}}">
                    <ng-template #personblank>
                        <img src="assets/img/icon/person.png">
                    </ng-template>
                </figure>
            </div>
            <div class="col px-0 align-self-center">
                <h3 class="mb-0 text-color-theme">{{firstname + " " + lastname}}</h3>
            </div>
            <div class="col-auto">
                <a (click)="showHideUploandImg()" class="btn btn-44 btn-light shadow-sm">
                    <i class="bi bi-camera"></i>
                </a>
            </div>
        </div>
    </div>
    <div class="card-body" *ngIf="!hideUploandImg">
        <div class="row">
            <div class="col-12">
                <div class="form-group form-floating">
                    <input type="file" class="input-upload" id="fileupload" ng2FileSelect [uploader]="uploader"
                        (change)="onFileSelected($event)">
                    <label for="fileupload"></label>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- profile information -->
<div class="row mb-3">
    <div class="col">
        <h6>{{"Profile Info" | translate}}</h6>
    </div>
</div>
<div class="row h-100 mb-4">
    <!-- อีเมล -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3 " [ngClass]="{'is-valid': email,'is-invalid':!email}">
            <input type="text" class="form-control" id="email" placeholder="{{'E-mail' | translate}}"
                [(ngModel)]="email">
            <label for="email">{{'E-mail' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="{{'Please enter email' | translate}}" *ngIf="!email">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
    </div>
    <!-- ชื่อ -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3" [ngClass]="{'is-valid': firstname,'is-invalid':!firstname}">
            <input type="text" class="form-control" id="firstname" placeholder="{{'Name' | translate}}"
                [(ngModel)]="firstname">
            <label for="firstname">{{'Name' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="{{'Please enter name' | translate}}" *ngIf="!firstname">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
    </div>
    <!-- นามสกุล -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3" [ngClass]="{'is-valid': lastname,'is-invalid':!lastname}">
            <input type="text" class="form-control" id="lastname" placeholder="{{'Surname' | translate}}"
                [(ngModel)]="lastname">
            <label for="lastname">{{'Surname' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="{{'Please enter surname' | translate}}" *ngIf="!lastname">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
    </div>
    <!-- เบอร์โทร -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3 is-valid">
            <input type="text" class="form-control" id="phone" placeholder="{{'Mobile Number' | translate}}"
                [(ngModel)]="mobile">
            <label for="phone">{{'Mobile Number' | translate}}</label>
        </div>
    </div>
    <!-- เพศ -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-floating mb-3 is-valid">
            <select class="form-control" id="sex" [(ngModel)]="sex">
                <option [value]="0">{{'Men' | translate}}</option>
                <option [value]="1">{{'Women' | translate}}</option>
                <option [value]="2">{{'Not specified' | translate}}</option>
            </select>
            <label for="sex">{{'Sex' | translate}}</label>
        </div>
    </div>
    <!-- รหัสผ่าน -->
    <!-- <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3 " [ngClass]="{'is-valid': password,'is-invalid':!password}">
            <input type="text" class="form-control" id="password" placeholder="{{'Password' | translate}}"
                [(ngModel)]="password">
            <label for="password">{{'Password' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="{{'Please enter password' | translate}}" *ngIf="!password">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
    </div> -->

    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3" [ngClass]="{'is-valid': password,'is-invalid':!password}">
            <input [type]="PassWord ? 'text' : 'password'" class="form-control" id="password"
                placeholder="{{'Password' | translate}}" [(ngModel)]="password" (ngModelChange)="checkOPeror=false">
            <label class="form-control-label" for="password">{{'Password' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="Enter valid Password" id="password" *ngIf="!password">
                <i class="bi bi-info-circle"></i>
            </button>
            <button type="button" class="btn btn-link text-default tooltip-btn" data-bs-toggle="tooltip"
                (click)="showPassWord('passWord')" data-bs-placement="left" title="Show Password" id="password"
                *ngIf="password">
                <!-- <i class="bi bi-eye"></i> -->
                <i class="bi" [ngClass]="PassWord ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
        </div>
    </div>

    <!-- ยืนยันรหัสผ่าน -->
    <!-- <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3 "
            [ngClass]="{'is-valid': confirmPassword,'is-invalid':!confirmPassword}">
            <input type="text" class="form-control" id="confirmPassword"
                placeholder="{{'Confirm Password' | translate}}" [(ngModel)]="confirmPassword">
            <label for="confirmPassword">{{'Confirm Password' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="{{'Please enter Confirm Password' | translate}}"
                *ngIf="!confirmPassword">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
    </div> -->

    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3"
            [ngClass]="{'is-valid': confirmPassword,'is-invalid':!confirmPassword || confirmPassword != password}">
            <input [type]="showConfirmPass ? 'text' : 'password'" class="form-control " id="confirmPassword"
                placeholder="{{'Confirm Password' | translate}}" [(ngModel)]="confirmPassword" (ngModelChange)="checkOPeror=false">
            <label class="form-control-label" for="confirmPassword">{{'Confirm Password' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="Enter valid confirmPassword" id="passworderror" *ngIf="!confirmPassword">
                <i class="bi bi-info-circle"></i>
            </button>
            <button type="button" class="btn btn-link text-default tooltip-btn" data-bs-toggle="tooltip"
                (click)="showPassWord('confirm')" data-bs-placement="left" title="Show Password" id="confirmPassword"
                *ngIf="confirmPassword">
                <!-- <i class="bi bi-eye"></i> -->
                <i class="bi" [ngClass]="showConfirmPass ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
        </div>
    </div>

    <!-- วันเกิด -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating  mb-3 is-valid">
            <input type="date" class="form-control" id="birthday" placeholder="{{'Birthday' | translate}}"
                [(ngModel)]="birthdate">
            <label for="birthday">{{'Birthday' | translate}}</label>
        </div>
    </div>
    <!-- เลขบัตรปชช -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating  mb-3 is-valid">
            <input type="text" class="form-control" id="idcard" placeholder="{{'ID card number' | translate}}"
                [(ngModel)]="idCard">
            <label for="idcard">{{'ID card number' | translate}}</label>
        </div>
    </div>
    <!-- เลขพาสปอต -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating  mb-3 is-valid">
            <input type="text" class="form-control" id="passport" placeholder="{{'Passport number' | translate}}"
                [(ngModel)]="passport">
            <label for="passport">{{'Passport number' | translate}}</label>
        </div>
    </div>
    <!-- ตำแหน่ง -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3 is-valid">
            <select class="form-control" id="department" [(ngModel)]="position">
                <option [value]="''">
                    {{'Position' | translate}} </option>
                <option *ngFor="let item of positionModel; let i = index" [value]="item">
                    {{item.getName()}}
                </option>
            </select>
            <label for="position">{{'Position' | translate}}</label>
            <!-- <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
            data-bs-placement="left" title="{{'Please enter Position' | translate}}" *ngIf="!position">
            <i class="bi bi-info-circle"></i>
        </button> -->
        </div>
    </div>
    <!-- แผนก -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3 is-valid">
            <select class="form-control" id="department" [(ngModel)]="department">
                <option [value]="''">
                    {{'Department' | translate}}
                </option>
                <option *ngFor="let item of departmentModel; let i = index" [value]="item">
                    {{item.getName()}}
                </option>
            </select>
            <label for="department">{{'Department' | translate}}</label>
            <!-- <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
            data-bs-placement="left" title="{{'Please enter Department' | translate}}" *ngIf="!department">
            <i class="bi bi-info-circle"></i>
        </button> -->
        </div>
    </div>
    <!-- สาขา -->

    <!-- lagacyCode -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3" [ngClass]="{'is-valid': lagacyCode,'is-invalid':!lagacyCode}">
            <input type="text" class="form-control" id="lagacyCode" placeholder="{{'lagacyCode' | translate}}"
                [(ngModel)]="lagacyCode">
            <label for="lagacyCode">{{'lagacyCode' | translate}}</label>
            <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
                data-bs-placement="left" title="{{'Please enter lagacyCode' | translate}}" *ngIf="!lagacyCode">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
    </div>
    <!-- taxid -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3 is-valid">
            <input type="text" class="form-control" id="taxid" placeholder="{{'taxid' | translate}}"
                [(ngModel)]="taxid">
            <label for="taxid">{{'taxid' | translate}}</label>
        </div>
    </div>
    <!-- หัวหน้า -->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="form-group form-floating mb-3 is-valid">
            <select class="form-control" id="boss" [(ngModel)]="boss">
                <option [value]="''">
                    {{'Boss_' | translate}}
                </option>
                <option *ngFor="let item of employeeList; let i=index" [value]="item.company_employeeId">
                    {{item.getFullname()}}
                </option>
            </select>
            <label for="boss">{{'Boss_' | translate}}</label>
            <!-- <button type="button" class="btn btn-link text-danger tooltip-btn" data-bs-toggle="tooltip"
            data-bs-placement="left" title="{{'Please enter Boss' | translate}}" *ngIf="!boss">
            <i class="bi bi-info-circle"></i>
        </button> -->
        </div>
    </div>

</div>
<div class="row h-100 ">
    <div class="col-12 mb-4">
        <button class="btn btn-default btn-lg w-100" [disabled]="isUpdateDisabled()"
            (click)="submit()">{{'BUTTON.SUBMIT' | translate}}</button>
    </div>
</div>
