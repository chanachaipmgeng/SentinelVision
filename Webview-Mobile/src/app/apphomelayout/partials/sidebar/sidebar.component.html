<div class="dpu-sidebar-panel sidebar dark-bg">
  <div class="dpu-sidebar-head">
    <figure class="avatar avatar-70 rounded-15">
      <img [src]="employeeModel?.getPicture() || 'assets/img/icon/person.png'" alt="">
    </figure>
    <button type="button" class="dpu-sidebar-close" (click)="menuclose()" aria-label="Close menu">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="dpu-sidebar-user">
    <p class="dpu-sidebar-name">{{ employeeModel?.getFullname() }}</p>
    <p class="dpu-sidebar-meta">{{ companyModel.companyName }} · {{ employeeModel?.position?.getName() }}</p>
    <button type="button" class="btn btn-sm btn-light mt-2" routerLink="/company/company-list" (click)="menuclose()">
      <i class="bi bi-building me-1"></i> เปลี่ยนบริษัท
    </button>
  </div>

  <nav class="dpu-sidebar-nav">
    <a class="dpu-sidebar-link" routerLink="/company/home-company" routerLinkActive="active" (click)="menuclose()">
      <span class="dpu-sidebar-icon"><i class="bi bi-house-door"></i></span>
      <span>{{ 'Home' | translate }}</span>
      <i class="bi bi-chevron-right ms-auto"></i>
    </a>

    <a class="dpu-sidebar-link" *ngFor="let item of listMenu" [routerLink]="item.link" routerLinkActive="active" (click)="menuclose()">
      <span class="dpu-sidebar-icon"><i class="bi" [ngClass]="item.icon"></i></span>
      <span>{{ item.name | translate }}</span>
      <i class="bi bi-chevron-right ms-auto"></i>
    </a>
  </nav>
</div>
