server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Static SPA only — uploads go to the API through the gateway.
    client_max_body_size 1m;
    server_tokens off;

    # Per-deployment runtime config written at container start by
    # /docker-entrypoint.d/40-runtime-config.sh into /tmp (writable even with a read-only
    # root fs). Never cache it.
    location = /assets/config.json {
        alias /tmp/dpu-runtime/config.json;
        add_header Cache-Control "no-store";
    }

    # Never cache the document — after each admin rebuild the hashed chunk
    # names change; a stale index.html (or in-tab old main) 404s lazy routes.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Hash-based Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
