<section class="dpu-section mb-3">
  <h6 class="title mb-0">สถิติการลงเวลา</h6>
</section>

<div class="card mb-3">
  <div class="card-body py-3">
    <div class="row align-items-center">
      <div class="col">
        <h6 class="mb-1 small text-muted">ช่วงวันที่</h6>
        <input type="text" placeholder="เลือกช่วงวันที่" readonly id="daterange"
          class="calendar-daterange form-control form-control-sm border-0 px-0"
          daterangepicker [options]="options" (selected)="selectedDate($event, daterange)">
      </div>
      <div class="col-auto">
        <button type="button" class="btn btn-light btn-44" onclick="document.getElementById('daterange').click()">
          <i class="bi bi-calendar-range"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="dpu-stat-grid mb-3">
  <div class="dpu-stat dpu-stat--ok">
    <div class="dpu-stat__label">ลงเวลาปกติ</div>
    <div class="dpu-stat__value">—</div>
  </div>
  <div class="dpu-stat dpu-stat--warn">
    <div class="dpu-stat__label">นอกพื้นที่</div>
    <div class="dpu-stat__value">—</div>
  </div>
  <div class="dpu-stat">
    <div class="dpu-stat__label">รวมทั้งหมด</div>
    <div class="dpu-stat__value">—</div>
  </div>
  <div class="dpu-stat">
    <div class="dpu-stat__label">พนักงาน</div>
    <div class="dpu-stat__value">—</div>
  </div>
</div>

<div class="card mb-4">
  <div class="card-header border-0 pb-0">
    <h6 class="title mb-0">แนวโน้มรายสัปดาห์</h6>
  </div>
  <div class="card-body px-2">
    <app-barchart></app-barchart>
  </div>
</div>

<div class="row mb-4">
  <div class="col-12 col-md-6">
    <div class="card h-100">
      <div class="card-header border-0 pb-0">
        <h6 class="title mb-0">สัดส่วนสถานะ</h6>
      </div>
      <div class="card-body">
        <app-doughnut-chart></app-doughnut-chart>
      </div>
    </div>
  </div>
  <div class="col-12 col-md-6 mt-3 mt-md-0">
    <div class="card mb-3">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="avatar avatar-40 rounded-circle bg-success text-white">
          <i class="bi bi-check-circle"></i>
        </div>
        <div>
          <p class="mb-0 fw-semibold">Complete</p>
          <small class="text-muted">ลงเวลาสำเร็จ</small>
        </div>
      </div>
    </div>
    <div class="card mb-3">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="avatar avatar-40 rounded-circle bg-warning text-white">
          <i class="bi bi-exclamation-triangle"></i>
        </div>
        <div>
          <p class="mb-0 fw-semibold">Warning</p>
          <small class="text-muted">ลงเวลานอกพื้นที่</small>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="avatar avatar-40 rounded-circle bg-primary text-white">
          <i class="bi bi-people"></i>
        </div>
        <div>
          <p class="mb-0 fw-semibold">Team</p>
          <small class="text-muted">ข้อมูลทีมงาน</small>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="dpu-quick-actions dpu-quick-actions--page mb-2">
  <a class="dpu-action-page" [routerLink]="historyLink">
    <i class="bi bi-clock-history"></i>
    <span>ประวัติ</span>
  </a>
  <a class="dpu-action-page" routerLink="/company/face-scan">
    <i class="bi bi-camera-fill"></i>
    <span>ลงเวลา</span>
  </a>
  <a class="dpu-action-page" routerLink="/company/subordinate-menu">
    <i class="bi bi-diagram-3"></i>
    <span>ทีมงาน</span>
  </a>
</div>
