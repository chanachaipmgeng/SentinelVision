# Lint / type-check configuration for the API (Phase B3 CI gates).
# Run locally from API-Fast/:  ruff check .   |   mypy src   |   python -m pytest -q
# No [build-system]: this package is deployed from source, not built as a wheel.

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["enrolled_images", "uploaded_images", "temp_images", "dist", "*.egg-info"]

[tool.ruff.lint]
# Pyflakes + pycodestyle errors + bugbear. Style/formatting rules are intentionally not
# enforced yet (the codebase predates the gate); add them one family at a time.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  # FastAPI idiom: `db: AsyncSession = Depends(get_db)` in signatures.
  "B008",
  # ---- Phase B3 baseline (pre-existing, measured 2026-11-07) ------------------------------
  # 40× `raise HTTPException(...)` inside `except` without `from exc`. Legit to fix, but it
  # touches almost every controller; tracked in docs/BACKLOG.md "Lint debt".
  "B904",
  # 3× `pytest.raises(Exception)` in older tests.
  "B017",
]

[tool.ruff.lint.per-file-ignores]
# Module-level sys.path / env setup before imports is deliberate in these entry points.
"scripts/seed_demo_data.py" = ["E402"]
"src/security/oidc.py" = ["E402"]
"tests/test_face_ws_auth_gating.py" = ["E402"]
"tests/test_kiosk_blacklist_exposure.py" = ["E402"]
# DB-backed test modules skip at import time (`pytest.skip(allow_module_level=True)`) before importing src.
"tests/test_authz_matrix.py" = ["E402"]
"tests/test_punch_shift_export.py" = ["E402"]
"tests/test_attendance_summary_shift_rules.py" = ["E402"]
"tests/test_punch_break_holiday.py" = ["E402"]
"tests/test_approvals_payroll.py" = ["E402"]
"tests/test_outbox_claiming.py" = ["E402"]
"tests/test_tenant_isolation.py" = ["E402"]
"tests/test_alembic_schema.py" = ["E402"]
"tests/test_app_startup.py" = ["E402"]
# Re-exports.
"src/models/__init__.py" = ["F401"]
"src/config/schema.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
# The images are Linux; pin the platform so a Windows/macOS laptop reports the same errors as CI
# (e.g. os.getuid in storage_service.ensure_dirs).
platform = "linux"
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = false
show_error_codes = true
pretty = false
exclude = ["^enrolled_images/", "^uploaded_images/", "^temp_images/"]

# ---- Phase B3 baseline -------------------------------------------------------------------
# These 31 modules carried 160 pre-existing errors on 2026-11-07 (mostly SQLAlchemy legacy
# `Column()` attributes typed as Column[...] → [assignment]/[arg-type], and Optional narrowing).
# Every other module under src/ is fully type-checked and new modules are checked by default.
# Remove a module from this list when its errors are fixed (tracked in docs/BACKLOG.md).
[[tool.mypy.overrides]]
module = [
    "src.clients.face_core_client",
    "src.config.database",
    "src.controllers.company_employee_controller",
    "src.controllers.dashboard_controller",
    "src.controllers.employee_import_controller",
    "src.controllers.employee_timestamp_controller",
    "src.controllers.face_controller",
    "src.controllers.face_ws_controller",
    "src.controllers.member_controller",
    "src.controllers.system_controller",
    "src.models.company_employee",
    "src.models.company_location",
    "src.models.company",
    "src.models.employee_timestamp",
    "src.models.member",
    "src.routes.auth_routes",
    "src.routes.employee_routes",
    "src.routes.hr_routes",
    "src.routes.member_routes",
    "src.routes.notification_routes",
    "src.routes.sentinel_routes",
    "src.security.deps",
    "src.security.middleware",
    "src.security.oidc",
    "src.services.face_match_service",
    # C1: SQLAlchemy Column[] comparisons on attendance_daily lookups.
    "src.services.attendance_summary_service",
    # B7 import hand-off: same legacy `Column()` attribute typing as the controllers above.
    "src.services.import_job_service",
    "src.services.observability",
    "src.services.sso_policy_service",
    "src.services.token_revocation_service",
    "src.utils.face_engine",
    "src.utils.face_gpu_queue",
    "src.utils.file_handler",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:authlib.*",
]
