<app-bento-grid gap="gap-3.5" extraClass="sv-contain-region">
  <!-- 1. Blacklist / POI -->
  <app-bento-stat
    colSpan="col-span-6 md:col-span-4 xl:col-span-2"
    label="Blacklist / เฝ้าระวัง"
    [value]="overview?.summary?.blacklistAndPoiCount || 0"
    accentTone="rose"
    icon="ri-alarm-warning-line"
    subText="แจ้งเตือนเงียบอัตโนมัติ">
  </app-bento-stat>

  <!-- 2. VIP -->
  <app-bento-stat
    colSpan="col-span-6 md:col-span-4 xl:col-span-2"
    label="บุคคลสำคัญ (VIP)"
    [value]="overview?.summary?.vipCount || 0"
    accentTone="amber"
    icon="ri-vip-crown-line"
    subText="ต้อนรับพิเศษที่จุดสแกน">
  </app-bento-stat>

  <!-- 3. Visitor -->
  <app-bento-stat
    colSpan="col-span-6 md:col-span-4 xl:col-span-2"
    label="ผู้มาติดต่อ (Visitor)"
    [value]="overview?.summary?.activeVisitorCount || 0"
    accentTone="violet"
    icon="ri-user-shared-line"
    subText="ลบใบหน้าอัตโนมัติตาม PDPA">
  </app-bento-stat>

  <!-- 4. Access Zones -->
  <app-bento-stat
    colSpan="col-span-6 md:col-span-4 xl:col-span-2"
    label="โซนประตู Access"
    [value]="overview?.summary?.activeZonesCount || 0"
    accentTone="sky"
    icon="ri-door-lock-box-line"
    subText="รองรับ IoT Relay & 2FA">
  </app-bento-stat>

  <!-- 5. Events -->
  <app-bento-stat
    colSpan="col-span-6 md:col-span-4 xl:col-span-2"
    label="งานอีเวนต์ / สัมมนา"
    [value]="overview?.summary?.liveEventsCount || 0"
    accentTone="cyan"
    icon="ri-calendar-event-line"
    [subText]="'ผู้ลงทะเบียน ' + (overview?.summary?.eventAttendeeCount || 0) + ' คน'">
  </app-bento-stat>

  <!-- 6. Occupancy / Muster -->
  <app-bento-stat
    colSpan="col-span-6 md:col-span-4 xl:col-span-2"
    label="คนในอาคารวันนี้"
    [value]="overview?.summary?.buildingOccupancyCount || 0"
    accentTone="emerald"
    icon="ri-building-2-line"
    [subText]="'ค้างตรวจสอบ ' + (overview?.summary?.unacknowledgedAlerts || 0) + ' เหตุการณ์'">
  </app-bento-stat>
</app-bento-grid>
