<div class="dpu-camera-overlay">
  <video #video width="640" height="480" class="dpu-camera-overlay__video" autoplay
    (loadedmetadata)="detectFace()">
  </video>
  <canvas #canvas width="640" height="480" class="dpu-camera-overlay__canvas"></canvas>
  <div class="dpu-camera-overlay__controls" *ngIf="checkMatch">
    <button type="button" class="ti-btn ti-btn-primary-full w-full" (click)="captureImage()">ตรวจสอบใบหน้า</button>
  </div>
</div>
