# Scrapes Docker json-file logs for dpu-* containers and pushes to Loki.
# Requires the docker.sock mount from docker-compose.loki.yml.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: dpu-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Keep only SentinelVision / DPU containers (container_name: dpu-…).
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(dpu-.*)"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      - replacement: dpu
        target_label: job
    pipeline_stages:
      # API / worker emit LOG_JSON=true lines; promote level + requestId when present.
      - docker: {}
      - match:
          selector: '{job="dpu"}'
          stages:
            - json:
                expressions:
                  level: level
                  logger: logger
                  service: service
                  requestId: requestId
                  message: message
            - labels:
                level:
                service:
            - output:
                source: message
